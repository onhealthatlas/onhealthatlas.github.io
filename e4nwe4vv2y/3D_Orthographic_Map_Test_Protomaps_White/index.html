<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<!-- pmtiles.js is a plain script (not a module) and sets the global `pmtiles` object -->
<script src="vendor/pmtiles.js"></script>
<style>
  html, body, #map {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
  }
  /* Dark surroundings make the globe read clearly against its background,
     similar to Google Earth's space backdrop. */
  body {
    background: #0b0e14;
  }
  #projection-toggle {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1;
    background: #ffffff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  }
  #projection-toggle:hover {
    background: #f2f2f2;
  }
</style>
</head>
<body>
<div id="map"></div>
<button id="projection-toggle" type="button">Switch to flat map</button>

<script type="module">
  import * as maplibregl from './vendor/maplibre-gl.mjs';

  // Register the pmtiles:// protocol so MapLibre can read the PMTiles archive
  // directly over HTTP range requests from Cloudflare R2.
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  const map = new maplibregl.Map({
    container: 'map',
    style: 'style.json', // already sets "projection": { "type": "globe" }
    center: [0, 20],
    zoom: 1.5,
    hash: true
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
  map.addControl(new maplibregl.ScaleControl());

  // Simple globe / flat-map toggle, following MapLibre's documented pattern.
  const toggleButton = document.getElementById('projection-toggle');
  toggleButton.addEventListener('click', () => {
    const current = map.getProjection().type;
    const next = current === 'globe' ? 'mercator' : 'globe';
    map.setProjection({ type: next });
    toggleButton.textContent = next === 'globe' ? 'Switch to flat map' : 'Switch to globe';
  });
</script>
</body>
</html>
