          gDocAge: "Médecins de famille selon l’âge", d60: "Près de la retraite (60 ans et plus)", d6064: "60 à 64 ans", d65: "65 ans et plus",
          gPatDoc: "Patients dont le médecin de famille a…", pd60: "60 ans et plus (près de la retraite)", pd6064: "60 à 64 ans", pd65: "65 ans ou plus",
          gPatAge: "Patients selon leur propre âge", p60: "60 ans et plus", p6064: "60 à 64 ans", p6569: "65 à 69 ans",
          p7074: "70 à 74 ans", p7579: "75 à 79 ans", p80: "80 ans et plus",
        },
        notes: {
          cityWide: (c, n) => `Cette circonscription fait partie de <b>${c}</b>, que la source ne présente que dans son ensemble. Les pourcentages et les taux affichés ici sont donc ceux de ${c}, et les nombres correspondent aux totaux de ${c} répartis entre ses ${n} circonscriptions selon la population (Recensement de 2021).`,
          partial: (pct, c) => `<b>Estimation partielle :</b> ${pct} % de la population de cette circonscription vit dans des municipalités partagées avec d’autres circonscriptions (la plus grande est ${c}). Leurs chiffres sont répartis entre ces circonscriptions selon la population (Recensement de 2021).`,
          cover: (pct) => `Environ ${pct} % des personnes de cette circonscription vivent dans des communautés absentes des données sources (surtout des réserves des Premières Nations); elles ne sont donc pas comptées ici.`,
          suppressed: "Certains très petits nombres (de 1 à 5) ont été masqués dans la source pour protéger la confidentialité. Ils sont estimés à 3 ici.",
          negative: "Plus de patients sont inscrits auprès de médecins d’ici que de personnes n’y habitent, probablement parce que des gens des environs consultent des médecins d’ici. Le nombre de personnes non inscrites auprès d’un médecin de famille ne peut donc pas être calculé pour ce territoire.",
          incomplete: (name, phys, pat) => `La source indique ${phys} médecins de famille à ${name}, mais ${pat ? `seulement ${pat} patients inscrits` : "aucun patient inscrit"}. Ces chiffres ne peuvent pas être complets (un médecin de famille compte généralement environ 1 100 patients); les chiffres sur les patients inscrits ne sont donc pas présentés pour ${name}.`,
          excluded: (list, share) => `Les chiffres d’inscription de cette circonscription ne tiennent pas compte de ${listJoin(list)} (${share} % de sa population) : la source y indique des médecins de famille, mais presque aucun patient inscrit. Dans le Grand Nord, les médecins qui travaillent dans le cadre d’ententes régionales n’inscrivent souvent pas leurs patients; la part de personnes non inscrites peut donc surestimer le manque de soins.`,
          noLocal: (n) => `Aucun médecin de famille ayant des patients inscrits n’exerce à ${n}. Les patients étant comptés là où leur médecin exerce, on ne peut pas savoir combien de résidents ont un médecin de famille ailleurs.`,
          noData: (n) => `${n} ne figure pas dans les données sources. C’est fréquent pour les réserves des Premières Nations et les petits cantons.`,
        },
        popCity: (c) => `Les pourcentages sont ceux de ${c} dans son ensemble.`,
        popNegative: "Plus de patients que de résidents : ne peut pas être calculé ici.",
        popNoLocal: "Aucun médecin de famille n’exerce ici.",
        popNoData: "Absent des données sources.",
        popIncomplete: "Les nombres de patients de la source sont incomplets ici.",
        popExcluded: (list) => `Les chiffres d’inscription excluent ${listJoin(list)} (nombres de patients incomplets).`,
        about: [
          "<b>Médecin de famille</b> désigne un médecin de famille qui a sa propre liste de patients inscrits. <b>Près de la retraite</b> signifie que le médecin a 60 ans ou plus. Les médecins ne prennent pas tous leur retraite au même âge, mais cela montre où des lacunes dans les soins pourraient apparaître au cours des prochaines années.",
          "<b>Non inscrits auprès d’un médecin de famille</b> correspond à la population moins les patients inscrits auprès d’un médecin de famille. Certaines personnes reçoivent des soins réguliers dans des centres de santé communautaires ou auprès de médecins qui n’inscrivent pas officiellement de patients; le nombre de personnes sans aucun suivi régulier pourrait donc être plus faible.",
          "Les patients sont comptés là où leur médecin de famille exerce, et non là où ils habitent. Les territoires où se trouvent de grandes cliniques peuvent compter plus de patients que de résidents, et les territoires voisins peuvent paraître en plus mauvaise posture qu’en réalité. Lorsqu’un chiffre ne peut pas être calculé, il est indiqué comme non disponible.",
          "À cinq endroits, la source indique des médecins de famille, mais presque aucun patient inscrit : Kenora, Sioux Lookout, Factory Island 1, Bonfield et Weagamow Lake 87. Leurs médecins sont comptés, mais ces endroits sont exclus de tous les chiffres sur les patients inscrits, y compris ceux de leur circonscription et les totaux de l’Ontario.",
          "« Non inscrits » est calculé sur l’ensemble de la population du territoire. Les mesures sur les patients sont calculées sur les patients inscrits auprès d’un médecin de famille. Les mesures sur les médecins sont calculées sur l’ensemble des médecins de famille.",
          "<b>Source :</b> Ontario Rostering Physician and Patient Counts Report, publication de janvier 2026 (nombres de médecins et de patients au 1er janvier 2026). Population : estimations de juillet 2024 pour les subdivisions de recensement; les chiffres de population sont donc environ 18 mois plus anciens que les nombres de médecins et de patients. Les chiffres par circonscription sont établis à partir des chiffres municipaux à l’aide des populations du Recensement de 2021.",
        ],
      },
    };

    // ----------------------------------------------------------------------------------------
    // Measures
    // ----------------------------------------------------------------------------------------
    const TOPICS = ["nodoc", "docs", "docret", "patret"];
    // up = higher is worse, down = lower is worse. kind: pct (0–100), rate (per 1,000) or count.
    // Values are grouped into colours exactly as they are displayed: percentages to 1 decimal, rates per
    // 1,000 to 2 decimals, counts to whole numbers. So "20% – 24.9%" holds every value shown as 20.0 to 24.9.
    const UNIT = { pct: 0.1, rate: 0.01, count: 1 };
    const DIGITS = { pct: 1, rate: 2, count: 0 };
    const roundAs = (v, kind) => (v == null ? null : Number((Math.round(v / UNIT[kind]) * UNIT[kind]).toFixed(DIGITS[kind])));
    const MEASURES = {
      nodoc_rate:   { kind: "pct",   dir: "up" },
      nodoc_count:  { kind: "count", dir: "up" },
      docs_rate:    { kind: "rate",  dir: "down" },
      docs_count:   { kind: "count", dir: "down" },
      docret_rate:  { kind: "pct",   dir: "up" },
      docret_count: { kind: "count", dir: "up" },
      patret_rate:  { kind: "pct",   dir: "up" },
      patret_count: { kind: "count", dir: "up" },
    };
    // Shades from least to most severe: five muted steel blues, from a mid-blue (no shade reads as "fine")
    // to near-black. Each step is equally darker (OKLCH lightness falls by 0.105 each time) and keeps a little
    // blue, so the darkest ones don't merge into black. Five rather than six because dark shades are the
    // hardest to tell apart. Lightest shade: 3.9:1 against the basemap.
    const RAMP = ["#407eb7", "#305d92", "#203e6b", "#122342", "#070c17"];
    const NODATA_COLOR = "#e6e7e3";

    // All derived figures for one area. layer: "ped" (riding) or "csd" (municipality).
    function derive(rec, layer) {
      if (!rec) return { hasData: false };
      const r = { hasData: true, ...rec };
      // incomplete: the source lists doctors here but almost no registered patients (see 2_build_data.py)
      r.incomplete = (rec.flags || []).includes("incomplete");
      // popP: the population the registration figures are worked out on. For a riding it leaves out any
      // municipality with incomplete patient counts (rec.excl); otherwise it is the whole population.
      const popP = rec.popP ?? rec.pop;
      r.popP = popP;
      r.d60 = rec.d6064 + rec.d65;
      r.pd60 = rec.pd6064 + rec.pd65;
      r.p60 = rec.p6064 + rec.p6569 + rec.p7074 + rec.p7579 + rec.p80;
      r.noLocal = layer === "csd" && rec.phys === 0 && rec.pat === 0;
      r.negative = popP > 0 && rec.pat > popP + 0.5;
      const unrostOk = popP > 0 && !r.negative && !r.noLocal && !r.incomplete;
      r.unrost = unrostOk ? Math.max(0, popP - rec.pat) : null;
      r.nodoc_count = r.unrost;
      r.nodoc_rate = unrostOk ? (r.unrost / popP) * 100 : null;
      r.docs_count = rec.phys;
      r.docs_rate = rec.pop > 0 ? (rec.phys / rec.pop) * 1000 : null;
      r.docret_count = rec.phys > 0 ? r.d60 : null;
      r.docret_rate = rec.phys > 0 ? (r.d60 / rec.phys) * 100 : null;
      r.patientsOk = rec.pat > 0 && !r.incomplete;
      r.patret_count = r.patientsOk ? r.pd60 : null;
      r.patret_rate = r.patientsOk ? (r.pd60 / rec.pat) * 100 : null;
      // Whole numbers for display. Riding counts are shares of municipal totals and carry decimals, so
      // each count is rounded once and totals are built from the rounded parts (60–64 + 65+ = 60+, etc.)
      // so the numbers shown always add up. Percentages are always worked out from the unrounded counts.
      const R = (v) => Math.round(v);
      const n = {};
      for (const k of ["pop", "pat", "phys", "d6064", "d65", "pd6064", "pd65", "p6064", "p6569", "p7074", "p7579", "p80"]) n[k] = R(rec[k]);
      n.d60 = n.d6064 + n.d65; n.u60 = Math.max(0, n.phys - n.d60);
      n.pd60 = n.pd6064 + n.pd65; n.pu60 = Math.max(0, n.pat - n.pd60);
      n.p60 = n.p6064 + n.p6569 + n.p7074 + n.p7579 + n.p80;
      n.popP = R(popP);
      n.unrost = unrostOk ? Math.max(0, n.popP - n.pat) : null;
      r.n = n;
      return r;
    }
    const ONTARIO = (() => {
      const keys = ["pop", "phys", "pat", "d6064", "d65", "pd6064", "pd65", "p6064", "p6569", "p7074", "p7579", "p80"];
      const patientKeys = ["pat", "pd6064", "pd65", "p6064", "p6569", "p7074", "p7579", "p80"];
      const sum = Object.fromEntries(keys.map((k) => [k, 0]));
      sum.popP = 0;
      for (const rec of Object.values(DATA.csd)) {
        const incomplete = (rec.flags || []).includes("incomplete");   // left out of the registration figures, as for ridings
        for (const k of keys) if (!(incomplete && patientKeys.includes(k))) sum[k] += rec[k];
        if (!incomplete) sum.popP += rec.pop;
      }
      for (const k of keys) if (k !== "pop") sum[k] += DATA.unknownLocation[k] || 0;   // doctors whose location wasn't matched
      return derive(sum, "ontario");
    })();

    // ----------------------------------------------------------------------------------------
    // Number formatting
    // ----------------------------------------------------------------------------------------
    let L = lang;   // the overlay's language, kept in step with the basemap's EN/FR button
    const t = () => T[L];
    const nf = {};
    function fmt(v, kind, opts = {}) {
      if (v == null || Number.isNaN(v)) return "–";
      const key = `${L}|${kind}|${opts.digits ?? ""}`;
      if (!nf[key]) {
        const digits = opts.digits ?? (kind === "pct" ? 1 : kind === "rate" ? 2 : 0);
        nf[key] = new Intl.NumberFormat(t().locale, { minimumFractionDigits: digits, maximumFractionDigits: digits });
      }
      const s = nf[key].format(kind === "count" && opts.digits == null ? Math.round(v) : v);
      return kind === "pct" ? s + (L === "fr" ? " %" : "%") : s;
    }

    // ----------------------------------------------------------------------------------------
    // Classes: about seven groups of roughly equal size, rounded to tidy numbers
    // ----------------------------------------------------------------------------------------
    function tidy(v, kind) {
      if (v <= 0) return v;
      if (kind === "pct") return v >= 10 ? Math.round(v) : Math.round(v * 2) / 2;
      const mag = 10 ** Math.floor(Math.log10(v));
      const sig = v / mag >= 3 ? 1 : 2;   // 2 significant figures below 3×10^n, 1 above (e.g. 2,400 / 30,000)
      let step = mag / (sig === 2 ? 10 : 2);
      if (kind === "count") step = Math.max(1, step);
      return Math.round(v / step) * step;
    }
    // Percentages and rates snap to an even step (e.g. every 5%), so the legend reads 20%, 25%, 30% …
    function niceStep(x) {
      const p = 10 ** Math.floor(Math.log10(x)), m = x / p;
      return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
    }
    function classify(values, kind, n = RAMP.length) {
      const sorted = values.slice().sort((a, b) => a - b);
      const zeros = sorted.filter((v) => v === 0).length;
      const zeroClass = zeros > 0 && zeros >= sorted.length / (n * 2);   // e.g. the many municipalities with no doctors
      const rest = zeroClass ? sorted.filter((v) => v > 0) : sorted;
      const k = zeroClass ? n - 1 : n;
      const breaks = zeroClass ? [UNIT[kind]] : [];   // zero gets a class of its own; the next starts at the smallest step above it
      const q = (i) => rest[Math.min(rest.length - 1, Math.floor((rest.length * i) / k))];
      // Counts spread over a narrow range (most riding counts) also snap to an even step; widely spread
      // counts (municipalities, from a handful to thousands) are rounded to 1–2 significant figures instead.
      const even = kind !== "count" || q(k - 1) / Math.max(q(1), 1e-9) < 5;
      const raw = Math.max(1e-6, (q(k - 1) - q(1)) / (k - 2));
      // Of the tidy step just below and just above the raw spacing, keep the one that spreads the areas
      // most evenly across the colours (smallest largest class).
      const evenBreaks = (st) => {
        const start = Math.round(((q(1) + q(k - 1)) / 2 - (st * (k - 2)) / 2) / st) * st;
        return Array.from({ length: k - 1 }, (_, i) => Number((start + i * st).toFixed(DIGITS[kind])));
      };
      const largestClass = (bs) => {
        const counts = new Array(bs.length + 1).fill(0);
        for (const v of rest) { let i = 0; while (i < bs.length && v >= bs[i]) i++; counts[i]++; }
        return Math.max(...counts);
      };
      let step = null;
      if (even && k > 2) {
        const lo = niceStep(raw), hi = niceStep(lo * 1.6);
        step = [lo, hi].map((st) => (kind === "count" ? Math.max(1, st) : st))
          .reduce((best, st) => (largestClass(evenBreaks(st)) < largestClass(evenBreaks(best)) ? st : best));
      }
      // Even steps: equal-width classes (20%, 25%, 30% …) centred on the middle of the data, so neither
      // end class swallows most areas. Otherwise each break is a quantile rounded to 1–2 significant figures.
      const evens = step ? evenBreaks(step) : null;
      for (let i = 1; i < k; i++) {
        let b = step ? evens[i - 1] : tidy(q(i), kind);
        b = Number(b.toFixed(DIGITS[kind]));
        if (b > rest[0] && b <= rest[rest.length - 1] && b > (breaks[breaks.length - 1] ?? -Infinity)) breaks.push(b);
      }
      return { breaks, zeroClass, max: sorted[sorted.length - 1] };
    }
    // Pick k colours from the ramp, always keeping both ends, ordered better -> worse.
    function rampFor(k) {
      if (k >= RAMP.length) return RAMP.slice();
      return Array.from({ length: k }, (_, i) => RAMP[Math.round((i * (RAMP.length - 1)) / Math.max(1, k - 1))]);
    }

    // ----------------------------------------------------------------------------------------
    // Overlay state and map layers
    // ----------------------------------------------------------------------------------------
    const state = { layer: "ped", topic: "nodoc", mode: "rate", selected: null, hover: null };
    const SRC = { ped: null, csd: null };   // GeoJSON with derived properties, once loaded
    const byId = { ped: new Map(), csd: new Map() };
    const classCache = {};
    const metricKey = () => `${state.topic}_${state.mode}`;

    function prepare(geojson, layer) {
      const features = geojson.features.map((f, i) => {
        const p = f.properties;
        const key = layer === "ped" ? String(p.ED_ID) : p.CSDUID;
        const rec = DATA[layer][key];
        const d = derive(rec, layer);
        const props = {
          key, hasData: d.hasData, noLocal: !!d.noLocal,
          name: layer === "ped" ? p.ENGLISH_NA : p.CSDNAME,
          name_fr: layer === "ped" ? p.FRENCH_NAM : p.CSDNAME,
        };
        for (const m of Object.keys(MEASURES)) if (d[m] != null) props[m] = roundAs(d[m], MEASURES[m].kind);
        const feat = { type: "Feature", id: i, properties: props, geometry: f.geometry };
        byId[layer].set(i, { feat, d, csdType: p.CSDTYPE, lp: DATA.lp[layer][key] });
        return feat;
      });
      return { type: "FeatureCollection", features };
    }

    // Every area's figures, worked out from the built-in data alone, so the legend can be drawn before the
    // boundary files arrive (the classes are the same either way: areas not in the source have no figures).
    const derivedAll = {};
    const allDerived = (layer) => (derivedAll[layer] ||= Object.values(DATA[layer]).map((rec) => derive(rec, layer)));
    function classesFor(layer, metric) {
      const ck = `${layer}|${metric}`;
      if (!classCache[ck]) {
        const values = [];
        for (const d of allDerived(layer)) if (d[metric] != null) values.push(roundAs(d[metric], MEASURES[metric].kind));
        classCache[ck] = classify(values, MEASURES[metric].kind);
      }
      return classCache[ck];
    }
    // Colour for each class, in value order (lowest values first).
    function colorsFor(metric, nClasses) {
      const c = rampFor(nClasses);
      return MEASURES[metric].dir === "up" ? c : c.reverse();
    }

    function fillExpression(layer, metric) {
      const { breaks } = classesFor(layer, metric);
      const colors = colorsFor(metric, breaks.length + 1);
      const step = ["step", ["to-number", ["get", metric]], colors[0]];
      breaks.forEach((b, i) => step.push(b, colors[i + 1]));
      return ["case", ["has", metric], step, NODATA_COLOR];
    }

    function hatchImage() {      // diagonal lines for areas where a figure can't be calculated
      const size = 16, c = document.createElement("canvas");
      c.width = c.height = size;
      const g = c.getContext("2d");
      g.fillStyle = NODATA_COLOR; g.fillRect(0, 0, size, size);
      g.strokeStyle = "#7d858f"; g.lineWidth = 2.2;
      for (const o of [-size, 0, size]) { g.beginPath(); g.moveTo(o, size); g.lineTo(o + size, 0); g.stroke(); }
      return g.getImageData(0, 0, size, size);
    }

    // The data layers go above the roads and below the basemap's borders and labels, with a copy of the
    // water on top so lakes and rivers still read as water.
    function addLayersFor(layer) {
      const before = map.getLayer("boundary_3") ? "boundary_3" : map.getStyle().layers.find((l) => l.type === "symbol")?.id;
      map.addSource(layer, { type: "geojson", data: SRC[layer], tolerance: 0.25, buffer: 128 });   // simplification stays under a quarter pixel at every zoom
      const vis = { visibility: state.layer === layer ? "visible" : "none" };
      if (!map.getLayer("water-over-data")) {
        const water = map.getStyle().layers.find((l) => l.id === "water");
        if (water) map.addLayer({ ...water, id: "water-over-data" }, before);
      }
      const fillsBefore = map.getLayer("water-over-data") ? "water-over-data" : before;
      map.addLayer({ id: `${layer}-fill`, type: "fill", source: layer, layout: vis,
        paint: { "fill-color": NODATA_COLOR, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 8, 1, 10, 0.86, 12, 0.74, 15, 0.6] } }, fillsBefore);   // solid when zoomed out, so the dark shades stay distinct
      map.addLayer({ id: `${layer}-hatch`, type: "fill", source: layer, layout: vis,
        filter: ["literal", false], paint: { "fill-pattern": "fd-hatch", "fill-opacity": 0.9 } }, fillsBefore);
      map.addLayer({ id: `${layer}-line`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-opacity": 0.8,
          "line-width": ["interpolate", ["linear"], ["zoom"], 4, layer === "ped" ? 0.6 : 0.3, 8, layer === "ped" ? 1.1 : 0.7, 12, 1.8] } }, before);
      map.addLayer({ id: `${layer}-hover`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-width": 2.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "hover"], false], 1, 0] } }, before);
      // Selection: a dark casing under a white line, visible on both light and black fills.
      map.addLayer({ id: `${layer}-sel-casing`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#000000", "line-width": 5.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "selected"], false], 0.75, 0] } }, before);
      map.addLayer({ id: `${layer}-sel`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-width": 2.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "selected"], false], 1, 0] } }, before);

      map.on("mousemove", `${layer}-fill`, (e) => {
        if (state.layer !== layer || !e.features.length) return;
        setHover(e.features[0].id);
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", `${layer}-fill`, () => { setHover(null); map.getCanvas().style.cursor = ""; });
    }

    function setHover(id) {
      const cur = state.hover;
      if (cur && cur.id === id && cur.layer === state.layer) return;
      if (cur && map.getSource(cur.layer)) map.setFeatureState({ source: cur.layer, id: cur.id }, { hover: false });
      state.hover = id == null ? null : { layer: state.layer, id };
      if (id != null) map.setFeatureState({ source: state.layer, id }, { hover: true });
    }

    function updateMapStyle() {
      const layer = state.layer, metric = metricKey();
      if (!SRC[layer] || !map.getLayer(`${layer}-fill`)) return;
      map.setPaintProperty(`${layer}-fill`, "fill-color", fillExpression(layer, metric));
      // hatched: the area is in the source but this figure can't be calculated
      map.setFilter(`${layer}-hatch`, ["all", ["==", ["get", "hasData"], true], ["!", ["has", metric]]]);
      for (const l of ["ped", "csd"]) {
        if (!map.getLayer(`${l}-fill`)) continue;
        for (const part of ["fill", "hatch", "line", "hover", "sel-casing", "sel"]) {
          map.setLayoutProperty(`${l}-${part}`, "visibility", l === layer ? "visible" : "none");
        }
      }
    }

    // ----------------------------------------------------------------------------------------
    // Controls: topics, shading, legend
    // ----------------------------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    function renderTopics() {
      const list = $("topicList");
      list.innerHTML = TOPICS.map((k) => `<button type="button" class="topic" role="radio" data-topic="${k}"
        aria-checked="${state.topic === k}" tabindex="${state.topic === k ? 0 : -1}"><span class="dot"></span><span>${esc(t().topics[k].short)}</span></button>`).join("");
      const [rateBtn, countBtn] = $("modeToggle").querySelectorAll("button");
      rateBtn.textContent = state.topic === "docs" ? t().modeRateDocs : t().modeRate;
      countBtn.textContent = t().modeCount;
      rateBtn.setAttribute("aria-pressed", state.mode === "rate");
      countBtn.setAttribute("aria-pressed", state.mode === "count");
    }
    $("topicList").addEventListener("click", (e) => {
      const b = e.target.closest(".topic");
      if (b) setTopic(b.dataset.topic, true);
    });
    $("topicList").addEventListener("keydown", (e) => {   // arrow keys move between the four choices
      const i = TOPICS.indexOf(state.topic);
      const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      setTopic(TOPICS[(i + step + TOPICS.length) % TOPICS.length], true);
    });
    $("modeToggle").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b || b.dataset.mode === state.mode) return;
      state.mode = b.dataset.mode;
      refresh();
    });
    function setTopic(k, focus) {
      state.topic = k;
      refresh();
      if (focus) $("topicList").querySelector(`[data-topic="${k}"]`)?.focus();
    }

    // Each class runs from its lower bound up to one display step below the next class:
    // "20% – 24.9%", "0.45 – 0.54", "1,000 – 1,999". Lower bounds that are whole percentages drop the ".0".
    function legendLabel(i, breaks, zeroClass, kind) {
      const lower = (v) => fmt(v, kind, { digits: kind === "pct" ? (Number.isInteger(v) ? 0 : 1) : DIGITS[kind] });
      const upper = (v) => fmt(v, kind, { digits: DIGITS[kind] });
      const below = (v) => Number((v - UNIT[kind]).toFixed(DIGITS[kind]));
      if (i === 0) return zeroClass ? (kind === "pct" ? lower(0) : t().none) : t().under(lower(breaks[0]));
      const lo = breaks[i - 1];
      if (i === breaks.length) return t().orMore(lower(lo));
      const hi = below(breaks[i]);
      return hi <= lo ? t().exactly(lower(lo)) : t().range(lower(lo), upper(hi));
    }

    function renderLegend() {
      const el = $("legend");
      const metric = metricKey(), m = MEASURES[metric], tp = t().topics[state.topic];
      const { breaks, zeroClass } = classesFor(state.layer, metric);
      const colors = colorsFor(metric, breaks.length + 1);
      // listed worst first, so the darkest shade is always at the top
      const rows = colors.map((c, i) => ({ c, label: legendLabel(i, breaks, zeroClass, m.kind) }));
      if (m.dir === "up") rows.reverse();
      let naRows = "";
      const anyHatch = allDerived(state.layer).some((d) => d[metric] == null);
      // areas on the map that the source doesn't list: known once the boundaries are in; until then, only municipalities have any
      const anyNoData = SRC[state.layer] ? [...byId[state.layer].values()].some(({ d }) => !d.hasData) : state.layer === "csd";
      if (anyHatch) {
        const onlyNoLocal = allDerived(state.layer).every((d) => d[metric] != null || d.noLocal);
        naRows += `<div class="lg-row"><span class="sw sw-na"></span>${esc(onlyNoLocal ? t().legendNoLocal : t().legendNA)}</div>`;
      }
      if (anyNoData) naRows += `<div class="lg-row"><span class="sw sw-nodata"></span>${esc(t().legendNoData)}</div>`;
      el.innerHTML = `<div class="lg-title">${esc(state.mode === "rate" ? tp.rate : tp.count)}</div>
        <div class="lg-caption">${esc(tp.caption)}</div>
        <div class="lg-rows">${rows.map((r) => `<div class="lg-row"><span class="sw" style="background:${r.c}"></span>${esc(r.label)}</div>`).join("")}</div>
        ${naRows ? `<div class="lg-extra">${naRows}</div>` : ""}
        <p class="lg-desc">${esc(state.mode === "rate" ? tp.descRate : tp.descCount)}</p>`;
    }

    // ----------------------------------------------------------------------------------------
    // Names and notes
    // ----------------------------------------------------------------------------------------
    function areaName(entry) {
      const p = entry.feat.properties;
      return L === "fr" ? p.name_fr || p.name : p.name;
    }
    function areaKind(entry, layer) {
      if (layer === "ped") return t().riding;
      const type = t().csdTypes[entry.csdType];
      if (["IRI", "S-É", "NO"].includes(entry.csdType)) return type;   // reserves and unorganized areas aren't municipalities
      return type && type !== t().municipality ? `${t().municipality} · ${type}` : t().municipality;
    }
    const isCityWide = (d) => d.splitShare >= 95 && d.splitWays > 1;
    function notesFor(entry, layer) {
      const d = entry.d, n = t().notes, name = esc(areaName(entry)), out = [];
      if (!d.hasData) return [{ cls: "", html: n.noData(name) }];
      if (layer === "ped") {
        if (isCityWide(d)) out.push({ cls: "", html: n.cityWide(esc(d.splitName), d.splitWays) });
        else if (d.exact < 90 && d.splitName) out.push({ cls: "", html: n.partial(fmtPlain(100 - d.exact), esc(d.splitName)) });
        if (d.cover < 97) out.push({ cls: "", html: n.cover(fmtPlain(100 - d.cover)) });
      }
      if (d.incomplete) out.push({ cls: "warn", html: n.incomplete(name, fmt(d.phys, "count"), d.pat > 0 ? fmt(d.pat, "count") : null) });
      if (layer === "ped" && d.excl) out.push({ cls: "warn", html: n.excluded(d.excl.map(esc), fmtPlain(d.exclShare)) });
      if (d.noLocal) out.push({ cls: "warn", html: n.noLocal(name) });
      if (d.negative) out.push({ cls: "warn", html: n.negative });
      if (d.flags && d.flags.includes("suppressed")) out.push({ cls: "", html: n.suppressed });
      return out;
    }
    const listJoin = (items) => items.length < 2 ? items.join("") : `${items.slice(0, -1).join(", ")} ${t().and} ${items[items.length - 1]}`;
    const fmtPlain = (v) => new Intl.NumberFormat(t().locale, { maximumFractionDigits: v < 10 ? 1 : 0 }).format(v);

    // ----------------------------------------------------------------------------------------
    // Popup
    // ----------------------------------------------------------------------------------------
    let popup = null;
    function topicFigures(d, topic) {   // [percentage or rate, number, unit] for one topic
      const u = t().units;
      switch (topic) {
        case "nodoc": return { rate: fmt(d.nodoc_rate, "pct"), count: fmt(d.n.unrost, "count"), unit: u.people };
        case "docs": return { rate: fmt(d.docs_rate, "rate"), count: fmt(d.n.phys, "count"), unit: u.doctors, rateUnit: u.per1000 };
        case "docret": return { rate: fmt(d.docret_rate, "pct"), count: fmt(d.docret_count == null ? null : d.n.d60, "count"), unit: u.doctors };
        case "patret": return { rate: fmt(d.patret_rate, "pct"), count: fmt(d.patret_count == null ? null : d.n.pd60, "count"), unit: u.patients };
      }
    }
    function popupHtml(entry) {
      const d = entry.d, layer = state.layer;
      let html = `<div class="pp-type">${esc(areaKind(entry, layer))}</div><div class="pp-name">${esc(areaName(entry))}</div>`;
      if (!d.hasData) return html + `<div class="pp-na">${esc(t().popNoData)}</div>`;
      const tp = state.topic, f = topicFigures(d, tp), topicText = t().topics[tp];
      const available = d[`${tp}_rate`] != null || d[`${tp}_count`] != null;
      if (available) {
        const big = state.mode === "rate" ? f.rate : f.count;
        const other = state.mode === "rate" ? `${f.count} ${f.unit}` : (tp === "docs" ? `${f.rate} ${f.rateUnit}` : f.rate);
        html += `<div class="pp-main"><div class="pp-big">${esc(big)}</div><div class="pp-mlbl"><b>${esc(state.mode === "rate" ? topicText.rate : topicText.count)}</b><br>${esc(other)}</div></div>`;
      } else {
        html += `<div class="pp-main"><div class="pp-mlbl"><b>${esc(topicText.short)}</b><br>${esc(d.incomplete ? t().popIncomplete : d.noLocal ? t().popNoLocal : d.negative ? t().popNegative : "–")}</div></div>`;
      }
      html += `<div class="pp-rows">`;
      for (const k of TOPICS) {
        if (k === tp) continue;
        const g = topicFigures(d, k);
        const val = k === "docs" ? `${g.count} · ${g.rate} ${g.rateUnit}` : (d[`${k}_rate`] == null ? "–" : `${g.rate} · ${g.count} ${g.unit}`);
        html += `<div class="pp-row"><span>${esc(t().topics[k].short)}</span><b>${esc(val)}</b></div>`;
      }
      html += `</div>`;
      const foot = [];
      if (layer === "ped" && isCityWide(d)) foot.push(t().popCity(d.splitName));
      if (d.noLocal && available) foot.push(t().popNoLocal);
      if (d.negative && tp !== "nodoc") foot.push(t().popNegative);
      if (d.incomplete && available) foot.push(t().popIncomplete);
      if (layer === "ped" && d.excl) foot.push(t().popExcluded(d.excl));
      if (foot.length) html += `<div class="pp-foot">${foot.map(esc).join(" ")}</div>`;
      return html;
    }
    function openPopup(entry, lngLat) {
      if (popup) popup.remove();
      popup = new maplibregl.Popup({ closeButton: true, maxWidth: "310px", offset: 8, focusAfterOpen: false })
        .setLngLat(lngLat).setHTML(popupHtml(entry)).addTo(map);
      popup.on("close", () => { if (popup && !popup.isOpen()) popup = null; });
    }

    // ----------------------------------------------------------------------------------------
    // Side panel with charts
    // ----------------------------------------------------------------------------------------
    // Shades for the stacked bars: light = the reassuring part, dark = the worrying part.
    const BAR = { good: "#9fd0ec", mid: "#245eac", bad: "#102349" };
    function stacked(segments, total) {   // value: exact (bar widths, %), shown: the whole number displayed
      const segs = segments.filter((s) => s.value > 0);
      const pct = (s) => fmt(total > 0 ? (s.value / total) * 100 : null, "pct");
      const bar = segs.map((s) => `<span style="flex-grow:${s.value};background:${s.color}" title="${esc(`${s.label}: ${fmt(s.shown, "count")} (${pct(s)})`)}"></span>`).join("");
      const keys = segments.map((s) => `<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span><span class="n">${fmt(s.shown, "count")}</span><span class="p">${pct(s)}</span></li>`).join("");
      const aria = segments.map((s) => `${s.label} ${fmt(s.shown, "count")} (${pct(s)})`).join(", ");
      return `<div class="sbar" role="img" aria-label="${esc(aria)}">${bar}</div><ul class="keyrows">${keys}</ul>`;
    }
    function cmp(text) { return `<div class="cmp">${esc(t().ontarioCmp)} <b>${esc(text)}</b></div>`; }

    function panelHtml(entry, layer) {
      const isOntario = !entry;
      const d = isOntario ? ONTARIO : entry.d;
      const x = t();
      let html = isOntario
        ? `<div class="area-eyebrow">${esc(x.allOntario)}</div><h2 class="area-name">Ontario</h2><p class="hint">${esc(x.ontarioHint)}</p>`
        : `<div class="area-eyebrow">${esc(areaKind(entry, layer))}</div><h2 class="area-name">${esc(areaName(entry))}</h2>
           <button type="button" class="clear-btn" data-action="clear">${esc(x.showOntario)}</button>`;
      if (!isOntario) for (const n of notesFor(entry, layer)) html += `<div class="note ${n.cls}">${n.html}</div>`;
      if (!d.hasData) return html + aboutHtml();
      const O = ONTARIO, n = d.n;

      // 1. Access
      html += `<section class="block"><h3>${esc(x.bAccess)}</h3>`;
      if (d.nodoc_rate != null) {
        html += `<div class="hero"><span class="big">${fmt(d.nodoc_rate, "pct")}</span><span class="lbl">${esc(x.heroNoDoc)}</span></div>
          ${stacked([{ label: x.segNoDoc, value: d.unrost, shown: n.unrost, color: BAR.bad }, { label: x.segHasDoc, value: d.popP - d.unrost, shown: n.popP - n.unrost, color: BAR.good }], d.popP)}
          ${isOntario ? "" : cmp(fmt(O.nodoc_rate, "pct"))}`;
      } else {
        html += `<div class="na-msg">${esc(x.naUnrost)}</div>`;
      }
      html += `</section>`;

      // 2. Family doctors
      html += `<section class="block"><h3>${esc(x.bDocs)}</h3><div class="stats2">
        <div class="stat"><div class="v">${fmt(n.phys, "count")}</div><div class="k">${esc(x.kDocs)}</div></div>
        <div class="stat"><div class="v">${fmt(d.docs_rate, "rate")}</div><div class="k">${esc(x.kPer1000)}</div>${isOntario ? "" : cmp(fmt(O.docs_rate, "rate"))}</div>
      </div></section>`;

      // 3. Doctors near retirement
      html += `<section class="block"><h3>${esc(x.bDocRet)}</h3>`;
      if (d.phys > 0) {
        html += `<div class="hero"><span class="mid">${fmt(d.docret_rate, "pct")}</span><span class="lbl">${esc(x.heroDocRet(`${fmt(n.d60, "count")} ${x.units.doctors}`))}</span></div>
          ${stacked([{ label: x.segU60, value: d.phys - d.d60, shown: n.u60, color: BAR.good }, { label: x.seg6064, value: d.d6064, shown: n.d6064, color: BAR.mid }, { label: x.seg65, value: d.d65, shown: n.d65, color: BAR.bad }], d.phys)}
          ${isOntario ? "" : cmp(fmt(O.docret_rate, "pct"))}`;
      } else html += `<div class="na-msg">${esc(x.naNoDocsHere)}</div>`;
      html += `</section>`;

      // 4. Patients whose doctor is near retirement
      html += `<section class="block"><h3>${esc(x.bPatRet)}</h3>`;
      if (d.patientsOk) {
        html += `<div class="hero"><span class="mid">${fmt(n.pd60, "count")}</span><span class="lbl">${esc(x.heroPatRet(fmt(d.patret_rate, "pct")))}</span></div>
          ${stacked([{ label: x.segDocU60, value: d.pat - d.pd60, shown: n.pu60, color: BAR.good }, { label: x.segDoc6064, value: d.pd6064, shown: n.pd6064, color: BAR.mid }, { label: x.segDoc65, value: d.pd65, shown: n.pd65, color: BAR.bad }], d.pat)}
          ${isOntario ? "" : cmp(fmt(O.patret_rate, "pct"))}`;
      } else html += `<div class="na-msg">${esc(d.incomplete ? x.naIncomplete : x.naNoPatients)}</div>`;
      html += `</section>`;

      // 5. Patients by their own age
      html += `<section class="block"><h3>${esc(x.bPatAge)}</h3>`;
      if (d.patientsOk) {
        const bands = [d.p6064, d.p6569, d.p7074, d.p7579, d.p80];
        const shown = [n.p6064, n.p6569, n.p7074, n.p7579, n.p80];
        const max = Math.max(...bands, 1);
        html += `<div class="hero"><span class="mid">${fmt((d.p60 / d.pat) * 100, "pct")}</span><span class="lbl">${esc(x.heroPatAge(`${fmt(n.p60, "count")} ${x.units.patients}`))}</span></div>
          <div class="hbars" role="img" aria-label="${esc(bands.map((v, i) => `${x.ages[i]}: ${fmt(shown[i], "count")}`).join(", "))}">
          ${bands.map((v, i) => `<div class="hbar"><span class="lab">${x.ages[i]}</span><span class="track"><span class="fill" style="width:${Math.max(0.5, (v / max) * 62)}%" title="${esc(`${x.ages[i]}: ${fmt(shown[i], "count")} (${fmt((v / d.pat) * 100, "pct")})`)}"></span><span class="val">${fmt(shown[i], "count")} <span>· ${fmt((v / d.pat) * 100, "pct")}</span></span></span></div>`).join("")}
          </div>`;
      } else html += `<div class="na-msg">${esc(d.incomplete ? x.naIncomplete : x.naNoPatients)}</div>`;
      html += `</section>`;

      html += tableHtml(d) + aboutHtml();
      return html;
    }

    function tableHtml(d) {
      const r = t().rows, n = d.n;
      const pct = (a, b) => (b > 0 && a != null ? fmt((a / b) * 100, "pct") : "–");
      const pp = (a) => (d.patientsOk ? pct(a, d.pat) : "–");   // shares of patients need complete patient counts
      const row = (label, n, p, kind = "count") => `<tr><td>${esc(label)}</td><td class="num">${n == null ? "–" : fmt(n, kind)}</td><td class="num">${p ?? ""}</td></tr>`;
      const group = (label) => `<tr><th>${esc(label)}</th><th class="num">${esc(t().colNumber)}</th><th class="num">${esc(t().colPct)}</th></tr>`;
      return `<details class="more"><summary>${esc(t().allFigures)}</summary><table class="all"><tbody>
        ${group(r.gAccess)}
        ${row(r.pop, n.pop)}
        ${row(r.hasDoc, n.pat, d.nodoc_rate == null ? "–" : pct(d.pat, d.popP))}
        ${row(r.noDoc, n.unrost, d.nodoc_rate != null ? fmt(d.nodoc_rate, "pct") : "–")}
        ${row(r.phys, n.phys)}
        ${row(r.per1000, d.docs_rate, "", "rate")}
        ${group(r.gDocAge)}
        ${row(r.d60, n.d60, pct(d.d60, d.phys))}
        ${row(r.d6064, n.d6064, pct(d.d6064, d.phys))}
        ${row(r.d65, n.d65, pct(d.d65, d.phys))}
        ${group(r.gPatDoc)}
        ${row(r.pd60, n.pd60, pp(d.pd60))}
        ${row(r.pd6064, n.pd6064, pp(d.pd6064))}
        ${row(r.pd65, n.pd65, pp(d.pd65))}
        ${group(r.gPatAge)}
        ${row(r.p60, n.p60, pp(d.p60))}
        ${row(r.p6064, n.p6064, pp(d.p6064))}
        ${row(r.p6569, n.p6569, pp(d.p6569))}
        ${row(r.p7074, n.p7074, pp(d.p7074))}
        ${row(r.p7579, n.p7579, pp(d.p7579))}
        ${row(r.p80, n.p80, pp(d.p80))}
      </tbody></table></details>`;
    }
    function aboutHtml() { return `<div class="about">${t().about.map((p) => `<p>${p}</p>`).join("")}</div>`; }

    function renderPanel() {
      const sel = state.selected;
      const entry = sel ? byId[sel.layer].get(sel.id) : null;
      $("panelBody").innerHTML = panelHtml(entry, sel?.layer);
    }
    $("panelBody").addEventListener("click", (e) => {
      if (e.target.closest('[data-action="clear"]')) select(null);
    });

    // ----------------------------------------------------------------------------------------
    // Selecting areas (click or search)
    // ----------------------------------------------------------------------------------------
    function select(id, lngLat) {
      const prev = state.selected;
      if (prev && map.getSource(prev.layer)) map.setFeatureState({ source: prev.layer, id: prev.id }, { selected: false });
      if (id == null) {
        state.selected = null;
        if (popup) { popup.remove(); popup = null; }
        renderPanel();
        return;
      }
      state.selected = { layer: state.layer, id };
      map.setFeatureState({ source: state.layer, id }, { selected: true });
      const entry = byId[state.layer].get(id);
      openPopup(entry, lngLat || entry.lp);
      renderPanel();
    }
    function bboxOf(geom) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const walk = (c) => { if (typeof c[0] === "number") { minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]); minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]); } else c.forEach(walk); };
      walk(geom.coordinates);
      return [[minX, minY], [maxX, maxY]];
    }
    function selectAndShow(id) {
      const entry = byId[state.layer].get(id);
      select(id, entry.lp);
      const cam = map.cameraForBounds(bboxOf(entry.feat.geometry), { padding: { ...ontarioPadding(), top: 90, bottom: 40 } });
      if (cam) map.easeTo({ center: cam.center, zoom: Math.min(cam.zoom, state.layer === "ped" ? 10.5 : 11.5), duration: 900 });
    }
    map.on("click", (e) => {
      if (!map.getLayer(`${state.layer}-fill`)) return;
      const hit = map.queryRenderedFeatures(e.point, { layers: [`${state.layer}-fill`] })[0];
      select(hit ? hit.id : null, e.lngLat);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && popup) popup.remove(); });

    // ----------------------------------------------------------------------------------------
    // Search
    // ----------------------------------------------------------------------------------------
    const input = $("searchInput"), box = $("suggestions");
    let matches = [], active = -1;
    const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[—–-]/g, " ").toLowerCase();
    function searchEntries() {
      return [...byId[state.layer].entries()].map(([id, e]) => ({ id, label: areaName(e), alt: e.feat.properties.name }));
    }
    function showMatches() {
      const q = fold(input.value.trim());
      if (!q || !SRC[state.layer]) { closeBox(); return; }
      const all = searchEntries();
      matches = all.filter((e) => fold(e.label).includes(q) || fold(e.alt).includes(q))
        .sort((a, b) => (fold(a.label).startsWith(q) ? 0 : 1) - (fold(b.label).startsWith(q) ? 0 : 1) || a.label.localeCompare(b.label, t().locale))
        .slice(0, 12);
      active = matches.length ? 0 : -1;
      box.innerHTML = matches.length
        ? matches.map((m, i) => `<div role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === active}">${esc(m.label)}</div>`).join("")
        : `<div class="empty">${esc(t().noMatch)}</div>`;
      box.style.display = "block";
      input.setAttribute("aria-expanded", "true");
      input.setAttribute("aria-activedescendant", active >= 0 ? `opt-${active}` : "");
    }
    function closeBox() { box.style.display = "none"; input.setAttribute("aria-expanded", "false"); }
    function choose(i) {
      const m = matches[i];
      if (!m) return;
      input.value = m.label;
      closeBox();
      selectAndShow(m.id);
    }
    input.addEventListener("input", showMatches);
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!matches.length) return;
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
        box.querySelectorAll('[role="option"]').forEach((o, i) => o.setAttribute("aria-selected", i === active));
        input.setAttribute("aria-activedescendant", `opt-${active}`);
        box.querySelector(`#opt-${active}`)?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (active >= 0) choose(active);
      } else if (e.key === "Escape") closeBox();
    });
    box.addEventListener("mousedown", (e) => { const o = e.target.closest('[role="option"]'); if (o) { e.preventDefault(); choose(+o.dataset.i); } });
    document.addEventListener("click", (e) => { if (!box.contains(e.target) && e.target !== input) closeBox(); });

    // ----------------------------------------------------------------------------------------
    // Riding / municipality switch
    // ----------------------------------------------------------------------------------------
    $("geoToggle").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b || b.dataset.layer === state.layer) return;
      select(null);
      setHover(null);
      state.layer = b.dataset.layer;
      input.value = "";
      closeBox();
      refresh();
      if (!SRC[state.layer]) showLoading(true);
    });
    function showLoading(on, text) {
      const el = $("loading");
      el.textContent = text || t().loading;
      el.style.display = on ? "block" : "none";
    }

    // ----------------------------------------------------------------------------------------
    // Language and refresh
    // ----------------------------------------------------------------------------------------
    function applyStaticText() {
      const x = t();
      $("txtTitle").textContent = x.title;
      $("txtSub").textContent = x.sub;
      $("btnByRiding").textContent = x.byRiding;
      $("btnByMuni").textContent = x.byMuni;
      $("geoToggle").setAttribute("aria-label", x.areasLabel);
      $("txtShowOnMap").textContent = x.showOnMap;
      $("txtShadeBy").textContent = x.shadeBy;
      input.placeholder = state.layer === "ped" ? x.searchPed : x.searchCsd;
      input.setAttribute("aria-label", input.placeholder);
      document.querySelectorAll("#geoToggle button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.layer === state.layer));
    }
    function refresh() {
      applyStaticText();
      renderTopics();
      updateMapStyle();
      renderLegend();
      renderPanel();
      $("layerCard").classList.add("ready");   // options, shading switch and legend are all in place
      if (popup && state.selected) popup.setHTML(popupHtml(byId[state.selected.layer].get(state.selected.id)));
    }
    const overlay = {
      setLanguage(next) {
        L = next;
        if (input.value) input.value = "";
        closeBox();
        refresh();
      },
    };

    // ----------------------------------------------------------------------------------------
    // Start
    // ----------------------------------------------------------------------------------------
    refresh();
    // Ctrl + scroll (and trackpad pinch, which browsers send as Ctrl + scroll) zooms the map while the pointer
    // is over the map itself, and over an area's popup (passed on to the map, as if the popup weren't there).
    // Anywhere else (header, side panel, options card, map buttons, attribution) the browser would zoom the
    // whole page instead, which is easy to do by accident, so it's switched off there. Where the plain wheel
    // zooms the map (see needCooperative), it does so over a popup too.
    document.addEventListener("wheel", (e) => {
      if (map.getCanvasContainer().contains(e.target)) return;   // the map handles it
      const overPopup = e.target.closest?.(".maplibregl-popup");
      if (!e.ctrlKey && !(overPopup && !map.cooperativeGestures.isEnabled())) return;   // ordinary scrolling
      e.preventDefault();
      if (overPopup) {
        map.getCanvas().dispatchEvent(new WheelEvent("wheel", {
          deltaX: e.deltaX, deltaY: e.deltaY, deltaZ: e.deltaZ, deltaMode: e.deltaMode,
          clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY,
          ctrlKey: e.ctrlKey, metaKey: e.metaKey, shiftKey: e.shiftKey, altKey: e.altKey, bubbles: true, cancelable: true,
        }));
      }
    }, { passive: false });

    // Two-finger gestures on phones and tablets. Pinching the page by accident (over the options card, the
    // header or the details) zooms the whole page, which is confusing next to a map that zooms on its own, so
    // it's switched off everywhere but the map: by touch-action in the CSS, and here too for browsers that don't
    // fully follow it. The browser's own zoom setting still zooms the page. Over an area's popup, two fingers
    // move and zoom the map, as if the popup weren't there. (MapLibre only listens for touches that start on
    // the map itself, so this is done here.)
    const canvasBox = map.getCanvasContainer(), mapEl = map.getContainer();
    const onPopup = (el) => !!el?.closest?.(".maplibregl-popup");
    let pinch = null;   // the two-finger gesture under way over a popup
    function fingers(e) {
      const r = canvasBox.getBoundingClientRect(), [a, b] = e.touches;
      return {
        mid: [(a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top],
        dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
      };
    }
    function syncPinch(e) {   // on every finger down or up: start, restart or end the gesture
      const ts = [...e.touches];
      const ours = ts.length === 2 && ts.some((t) => onPopup(t.target)) && ts.every((t) => mapEl.contains(t.target));
      if (!ours) {
        if (pinch?.panWasOn) map.dragPan.enable();
        pinch = null;
        return;
      }
      if (!pinch) {
        map.stop();
        // A finger on the map beside the popup would otherwise move the map too. Switching the map's own
        // dragging off and on again also stops it jumping when the popup finger lifts.
        const panWasOn = map.dragPan.isEnabled();
        if (panWasOn) map.dragPan.disable();
        pinch = { panWasOn };
      }
      const f = fingers(e);
      Object.assign(pinch, { dist: f.dist, zoom: map.getZoom(), at: map.unproject(f.mid) });
    }
    function movePinch(e) {
      const f = fingers(e);
      if (f.dist > 0 && pinch.dist > 0) map.jumpTo({ zoom: pinch.zoom + Math.log2(f.dist / pinch.dist) });
      for (let i = 0; i < 2; i++) {   // then put the place first under the fingers back under them
        const p = map.project(pinch.at), c = map.project(map.getCenter());
        const dx = p.x - f.mid[0], dy = p.y - f.mid[1];
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) break;
        map.jumpTo({ center: map.unproject([c.x + dx, c.y + dy]) });
      }
    }
    for (const type of ["touchstart", "touchend", "touchcancel"]) document.addEventListener(type, syncPinch, { capture: true, passive: true });
    document.addEventListener("touchmove", (e) => {
      if (e.touches.length < 2) return;   // one finger scrolls the page (or moves the map, where it does that)
      if (pinch) { e.preventDefault(); movePinch(e); }
      else if (!canvasBox.contains(e.target)) e.preventDefault();   // over the map, the map handles it
    }, { capture: true, passive: false });
    // Safari's own pinch gesture events
    for (const type of ["gesturestart", "gesturechange"]) {
      document.addEventListener(type, (e) => { if (!canvasBox.contains(e.target)) e.preventDefault(); }, { passive: false });
    }

    // Keep the map's drawing surface the same size as its box. If the box changes size around the time the
    // map is created (e.g. the header wraps onto another line), MapLibre can miss it; the map is then drawn
    // stretched and the mouse lands on the wrong area. So resize when (and only when) the two differ: an
    // unneeded resize before the map's first frame paints the basemap's near-white space glow behind an
    // empty map, which shows as a white flash while the page loads.
    const mapBox = document.getElementById("map");
    function fitCanvasToBox() {
      const c = map.getCanvas();
      // Redraw at once (as MapLibre does itself): resizing clears the canvas, and an empty frame flashes.
      if (Math.abs(c.clientWidth - mapBox.clientWidth) > 0.5 || Math.abs(c.clientHeight - mapBox.clientHeight) > 0.5) map.resize().redraw();
    }
    new ResizeObserver(fitCanvasToBox).observe(mapBox);
    map.once("load", fitCanvasToBox);
    // A browser window can be narrowed to phone width (or widened back), so keep the scroll behaviour in step.
    window.matchMedia("(max-width: 860px)").addEventListener("change", () => {
      if (needCooperative()) map.cooperativeGestures.enable(); else map.cooperativeGestures.disable();
    });

    // Opening view: Ontario centred in the open part of the map (between the options card and the right edge),
    // with equal gaps above and below, and equal gaps left and right. Fitting a lat/long box doesn't do this on
    // the globe (its corners aren't where Ontario's edges appear), so measure where Ontario's outline actually
    // lands on screen and adjust until it sits in the middle.
    function centreOntario() {
      const box = mapBox.getBoundingClientRect(), card = document.getElementById("layerCard").getBoundingClientRect();
      const gap = narrowScreen() ? 12 : 24;
      const left = narrowScreen() ? 0 : Math.max(0, card.right - box.left);
      const area = { x0: left + gap, x1: box.width - gap, y0: gap, y1: box.height - gap };
      for (let i = 0; i < 8; i++) {
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        for (const p of DATA.outline) { const q = map.project(p); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
        const scale = Math.min((area.x1 - area.x0) / (x1 - x0), (area.y1 - area.y0) / (y1 - y0));
        const dx = (x0 + x1) / 2 - (area.x0 + area.x1) / 2, dy = (y0 + y1) / 2 - (area.y0 + area.y1) / 2;
        if (Math.abs(Math.log2(scale)) < 0.001 && Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) break;
        const c = map.project(map.getCenter());
        map.jumpTo({ center: map.unproject([c.x + dx, c.y + dy]), zoom: map.getZoom() + Math.log2(scale) });
      }
    }
    if (!startedWithView) {
      if (map.style?._loaded) centreOntario();
      else map.once("style.load", centreOntario);   // after the basemap has switched on the globe
    }
    const mapLoaded = new Promise((resolve) => (map.loaded() ? resolve() : map.once("load", resolve)));
    async function loadLayer(layer, request) {
      try {
        const [geojson] = await Promise.all([request, mapLoaded]);
        SRC[layer] = prepare(geojson, layer);
        if (!map.hasImage("fd-hatch")) map.addImage("fd-hatch", hatchImage(), { pixelRatio: 2 });
        addLayersFor(layer);
        if (state.layer === layer) showLoading(false);
        refresh();
      } catch (err) {
        console.error(err);
        if (state.layer === layer) showLoading(true, t().loadError);
      }
    }
    showLoading(true);
    loadLayer("ped", ridingsRequest).then(() => loadLayer("csd", csdsRequest));
  </script>
</body>
</html>
