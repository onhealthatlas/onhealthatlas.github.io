    // Shares use the fixed steps above. Numbers (which depend on each area's size) are split into five groups of
    // roughly equal size, rounded to tidy numbers: separately for everyone, renters and owners, and on the metro
    // map across all the years together, so the years can be compared.
    function tidy(v) {
      if (v <= 0) return v;
      const mag = 10 ** Math.floor(Math.log10(v));
      const sig = v / mag >= 3 ? 1 : 2;   // 2 significant figures below 3×10^n, 1 above (e.g. 2,400 / 30,000)
      const step = Math.max(1, mag / (sig === 2 ? 10 : 2));
      return Math.round(v / step) * step;
    }
    function quantileBreaks(values, k) {
      const sorted = values.slice().sort((a, b) => a - b);
      const q = (i) => sorted[Math.min(sorted.length - 1, Math.floor((sorted.length * i) / k))];
      const breaks = [];
      for (let i = 1; i < k; i++) {
        const b = tidy(q(i));
        if (b > sorted[0] && b <= sorted[sorted.length - 1] && b > (breaks[breaks.length - 1] ?? -Infinity)) breaks.push(b);
      }
      return breaks;
    }
    function rampFor(k) {   // k colours from the ramp, always keeping both ends, lighter -> darker
      if (k >= RAMP.length) return RAMP.slice();
      return Array.from({ length: k }, (_, i) => RAMP[Math.round((i * (RAMP.length - 1)) / Math.max(1, k - 1))]);
    }
    const classCache = {};
    function classesFor(layer, metric) {
      const kind = kindOf(metric);
      if (kind === "pct") return { breaks: PCT_BREAKS[isSurvey(layer) ? "a" : metric[0]], colors: RAMP.slice() };
      const ck = isSurvey(layer) ? `${layer}|count` : `${layer}|${metric}`;
      if (classCache[ck]) return classCache[ck];
      const pool = isSurvey(layer) ? METRICS.survey.filter((m) => m.endsWith("_count")) : [metric];
      const values = allDerived(layer).flatMap((d) => pool.map((m) => d[m])).filter((v) => v != null);
      const breaks = quantileBreaks(values, 5);
      return (classCache[ck] = { breaks, colors: rampFor(breaks.length + 1) });
    }

    // ----------------------------------------------------------------------------------------
    // Overlay state and map layers
    // ----------------------------------------------------------------------------------------
    const state = { layer: "ped", who: "a", year: LAST_YEAR, mode: "rate", selected: null, hover: null };
    const SRC = { ped: null, csd: null, cma: null };   // GeoJSON with derived properties, once loaded
    const byId = { ped: new Map(), csd: new Map(), cma: new Map() };
    const metricKey = () => (isSurvey(state.layer) ? `y${state.year}_${state.mode}` : `${state.who}_${state.mode}`);
    const ridingName = {};   // ED_ID -> { en, fr }

    function names(layer, p) {   // { en, fr, alt (searched too), type }
      if (layer === "ped") return { en: p.ENGLISH_NA, fr: p.FRENCH_NAM, alt: `${p.ENGLISH_NA} ${p.FRENCH_NAM}` };
      if (layer === "csd") {
        const [en, fr] = p.CSDNAME.split(" / ");   // "Greater Sudbury / Grand Sudbury"
        return { en, fr: fr || en, alt: p.CSDNAME, type: p.CSDTYPE };
      }
      const [en, fr, isMetro] = DATA.cmaInfo[p.CMAUID] || [p.CMANAME, p.CMANAME, 0];
      return { en, fr, alt: `${en} ${fr}`, type: isMetro ? "metro" : "ca" };
    }
    const keyOf = (layer, p) => (layer === "ped" ? String(p.ED_ID) : layer === "csd" ? p.CSDUID : p.CMAUID);
    function prepare(geojson, layer) {
      const features = geojson.features.map((f, i) => {
        const p = f.properties, key = keyOf(layer, p), nm = names(layer, p);
        const d = derive(DATA[layer][key], layer, key);
        if (layer === "ped") ridingName[key] = { en: nm.en, fr: nm.fr };
        const props = { key, status: d.status, name: nm.en, name_fr: nm.fr };
        for (const m of metricsFor(layer)) {
          if (d[m] != null) { props[m] = roundAs(d[m], kindOf(m)); props[`rel_${m}`] = d[`rel_${m}`]; }
        }
        const feat = { type: "Feature", id: i, properties: props, geometry: f.geometry };
        byId[layer].set(i, { feat, d, key, nm, lp: DATA.lp[layer][key] });
        return feat;
      });
      return { type: "FeatureCollection", features };
    }

    // Every area's figures from the built-in data alone, so the legend can be drawn before the boundaries arrive.
    const derivedAll = {};
    const allDerived = (layer) => (derivedAll[layer] ||= Object.entries(DATA[layer]).map(([key, rec]) => derive(rec, layer, key)));

    function fillExpression(layer, metric) {
      const { breaks, colors } = classesFor(layer, metric);
      const step = ["step", ["to-number", ["get", metric]], colors[0]];
      breaks.forEach((b, i) => step.push(b, colors[i + 1]));
      return ["case", ["has", metric], step, ["==", ["get", "status"], "ca"], CA_COLOR, NODATA_COLOR];
    }

    function hatchImage() {      // diagonal lines: no figure (not published, or too unreliable)
      const size = 16, c = document.createElement("canvas");
      c.width = c.height = size;
      const g = c.getContext("2d");
      g.fillStyle = NODATA_COLOR; g.fillRect(0, 0, size, size);
      g.strokeStyle = "#7d858f"; g.lineWidth = 2.2;
      for (const o of [-size, 0, size]) { g.beginPath(); g.moveTo(o, size); g.lineTo(o + size, 0); g.stroke(); }
      return g.getImageData(0, 0, size, size);
    }

    // The data layers go above the roads and below the basemap's borders and labels, with a copy of the
    // water on top so lakes and rivers still read as water. The hover and selection outlines go above the
    // borders (so an area on the Manitoba, Quebec or US border is outlined all the way round), still below
    // the labels.
    const LINE_WIDTH = { ped: [0.6, 1.1], csd: [0.3, 0.7], cma: [0.6, 1.1] };
    function addLayersFor(layer) {
      const labels = map.getStyle().layers.find((l) => l.type === "symbol")?.id;
      const before = map.getLayer("boundary_3") ? "boundary_3" : labels;
      map.addSource(layer, { type: "geojson", data: SRC[layer], tolerance: 0.25, buffer: 128 });   // simplification stays under a quarter pixel at every zoom
      const vis = { visibility: state.layer === layer ? "visible" : "none" };
      if (!map.getLayer("water-over-data")) {
        const water = map.getStyle().layers.find((l) => l.id === "water");
        if (water) map.addLayer({ ...water, id: "water-over-data" }, before);
        // Ice shelves lie over the sea (zoomed out, the ocean is drawn underneath them, as around Antarctica), so the
        // water copy would hide them, and its soft edge would leave a thin grey line where the shelves meet the land ice.
        // So the basemap's ice shelves and land ice (glaciers) move up above it, in the basemap's own order.
        // Nothing in the data is near either.
        for (const id of ["landcover_ice_shelf", "landcover_glacier"]) if (map.getLayer(id)) map.moveLayer(id, before);
      }
      const fillsBefore = map.getLayer("water-over-data") ? "water-over-data" : before;
      map.addLayer({ id: `${layer}-fill`, type: "fill", source: layer, layout: vis,
        paint: { "fill-color": NODATA_COLOR, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 8, 1, 10, 0.86, 12, 0.74, 15, 0.6] } }, fillsBefore);   // solid when zoomed out, so the dark shades stay distinct
      map.addLayer({ id: `${layer}-hatch`, type: "fill", source: layer, layout: vis,
        filter: ["literal", false], paint: { "fill-pattern": "chn-hatch", "fill-opacity": 0.9 } }, fillsBefore);
      const [w4, w8] = LINE_WIDTH[layer];
      map.addLayer({ id: `${layer}-line`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-opacity": 0.8, "line-width": ["interpolate", ["linear"], ["zoom"], 4, w4, 8, w8, 12, 1.8] } }, before);
      map.addLayer({ id: `${layer}-hover`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-width": 2.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "hover"], false], 1, 0] } }, labels);
      // Selection: a dark casing under a white line, visible on both light and black fills.
      map.addLayer({ id: `${layer}-sel-casing`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#000000", "line-width": 5.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "selected"], false], 0.75, 0] } }, labels);
      map.addLayer({ id: `${layer}-sel`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-width": 2.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "selected"], false], 1, 0] } }, labels);

      map.on("mousemove", `${layer}-fill`, (e) => {
        if (state.layer !== layer || !e.features.length) return;
        setHover(e.features[0].id);
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", `${layer}-fill`, () => { setHover(null); map.getCanvas().style.cursor = ""; });
    }

    function setHover(id) {
      const cur = state.hover;
      if (cur && cur.id === id && cur.layer === state.layer) return;
      if (cur && map.getSource(cur.layer)) map.setFeatureState({ source: cur.layer, id: cur.id }, { hover: false });
      state.hover = id == null ? null : { layer: state.layer, id };
      if (id != null) map.setFeatureState({ source: state.layer, id }, { hover: true });
    }

    const PARTS = ["fill", "hatch", "line", "hover", "sel-casing", "sel"];
    function updateMapStyle() {
      const layer = state.layer, metric = metricKey();
      if (SRC[layer] && map.getLayer(`${layer}-fill`)) {
        map.setPaintProperty(`${layer}-fill`, "fill-color", fillExpression(layer, metric));
        // hatched: no figure to show (not published, or too unreliable); reserves and smaller cities stay plain grey
        map.setFilter(`${layer}-hatch`, ["all", ["in", ["get", "status"], ["literal", ["ok", "na"]]], ["!", ["has", metric]]]);
      }
      for (const l of LAYERS) {
        if (!map.getLayer(`${l}-fill`)) continue;
        for (const part of PARTS) map.setLayoutProperty(`${l}-${part}`, "visibility", l === layer ? "visible" : "none");
      }
    }

    // ----------------------------------------------------------------------------------------
    // Controls: year, who, shading, legend
    // ----------------------------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    function renderControls() {
      const x = t();
      $("yearRow").hidden = !isSurvey(state.layer);
      $("whoRow").hidden = isSurvey(state.layer);
      for (const [id, attr, labels, cur] of [["yearToggle", "year", null, String(state.year)], ["whoToggle", "who", x.whoBtn, state.who],
        ["modeToggle", "mode", { rate: x.modeRate, count: x.modeCount }, state.mode]]) {
        $(id).querySelectorAll("button").forEach((b) => {
          if (labels) b.textContent = labels[b.dataset[attr]];
          b.setAttribute("aria-pressed", b.dataset[attr] === cur);
        });
      }
    }
    for (const [id, attr] of [["yearToggle", "year"], ["whoToggle", "who"], ["modeToggle", "mode"]]) {
      $(id).addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const v = attr === "year" ? Number(b.dataset.year) : b.dataset[attr];
        if (v === state[attr]) return;
        state[attr] = v;
        refresh();
      });
    }

    // Each class runs from its lower bound up to one display step below the next class: "15% – 19.9%",
    // "1,000 – 1,999". Lower bounds that are whole numbers drop the ".0".
    function legendLabel(i, cls, kind) {
      const { breaks } = cls, x = t();
      const lower = (v) => fmt(v, kind, { digits: Number.isInteger(v) ? 0 : DIGITS[kind] });
      const below = (v) => Number((v - UNIT[kind]).toFixed(DIGITS[kind]));
      if (i === breaks.length) return x.orMore(lower(breaks[i - 1]));
      if (i === 0) return x.under(lower(breaks[0]));
      const lo = breaks[i - 1], hi = below(breaks[i]);
      if (hi <= lo) return x.exactly(lower(lo));
      return x.range(lower(lo), fmt(hi, kind));
    }

    function renderLegend() {
      const el = $("legend"), x = t();
      const layer = state.layer, metric = metricKey(), kind = kindOf(metric), cls = classesFor(layer, metric);
      const rows = cls.colors.map((c, i) => ({ c, label: legendLabel(i, cls, kind) })).reverse();   // darkest (worst) first
      const all = allDerived(layer).filter((d) => d.status === "ok");
      let extra = "";
      const anyNA = all.some((d) => d[metric] == null) || (SRC[layer] ? [...byId[layer].values()].some(({ d }) => d.status === "na") : layer === "csd");
      if (anyNA) extra += `<div class="lg-row"><span class="sw sw-na"></span>${esc(x.legendNA)}</div>`;
      if (layer === "csd") extra += `<div class="lg-row"><span class="sw sw-nodata"></span>${esc(x.legendReserve)}</div>`;
      if (layer === "cma") extra += `<div class="lg-row"><span class="sw" style="background:${CA_COLOR}"></span>${esc(x.legendCA)}</div>`;
      const w = x.whoNoun[isSurvey(layer) ? "a" : state.who];
      const src = isSurvey(layer) ? x.surveyYear(state.year) : x.census;
      const title = state.mode === "rate" ? x.lgTitle.rate(w, src) : x.lgTitle.count(w, src);
      const desc = isSurvey(layer)
        ? (state.mode === "rate" ? x.lgDesc.surveyRate(state.year) : x.lgDesc.surveyCount(state.year))
        : (state.mode === "rate" ? x.lgDesc.censusRate(w) : x.lgDesc.censusCount(w));
      el.innerHTML = `<div class="lg-title">${esc(title)}</div>
        <div class="lg-caption">${esc(x.lgCaption)}</div>
        <div class="lg-rows">${rows.map((r) => `<div class="lg-row"><span class="sw" style="background:${r.c}"></span>${esc(r.label)}</div>`).join("")}</div>
        ${extra ? `<div class="lg-extra">${extra}</div>` : ""}
        <p class="lg-desc">${esc(desc)}</p>`;
    }

    // ----------------------------------------------------------------------------------------
    // Names and notes
    // ----------------------------------------------------------------------------------------
    const rName = (ed) => (ridingName[ed] ? ridingName[ed][L] : String(ed));
    const areaName = (entry) => entry.nm[L] || entry.nm.en;
    function areaKind(entry, layer) {
      const x = t();
      if (layer === "ped") return x.riding;
      if (layer === "cma") return entry.nm.type === "metro" ? x.metro : x.smallCity;
      const type = x.csdTypes[entry.nm.type];
      if (["IRI", "S-É", "NO"].includes(entry.nm.type)) return type;   // reserves and unorganized areas aren't municipalities
      return type && type !== x.municipality ? `${x.municipality} · ${type}` : x.municipality;
    }
    const listJoin = (items) => (items.length < 2 ? items.join("") : `${items.slice(0, -1).join(", ")} ${t().and} ${items[items.length - 1]}`);
    const metroName = (uid) => (DATA.cmaInfo[uid] ? DATA.cmaInfo[uid][L === "fr" ? 1 : 0] : uid);

    // The reliability note for a census figure (group g), or "".
    function relNote(g, pp) {
      const x = t(), lo = g.lo == null ? null : pct(g.lo), hi = g.hi == null ? null : pct(g.hi);
      if (g.rel === 1 && g.p <= 0) return pp ? x.ppZero : x.notes.zero;
      if (g.rel === 1) return pp ? x.ppCaution(lo, hi) : x.notes.caution(lo, hi);
      if (g.rel === 2) return pp ? x.ppUnreliable(lo, hi) : x.notes.unreliable(lo, hi);
      return "";
    }
    function notesFor(entry, layer) {
      const d = entry.d, n = t().notes, name = esc(areaName(entry)), out = [];
      if (d.status === "res") return [{ cls: "", html: n.reserve(name) }];
      if (d.status === "na") return [{ cls: "", html: n.na(name) }];
      if (d.status === "ca") return [{ cls: "", html: n.ca(name) }];
      if (layer === "ped" && d.est) out.push({ cls: "", html: n.est });
      if (layer === "ped" && d.res) out.push({ cls: "", html: n.res(pctPlain(d.res)) });
      if (layer === "cma" && entry.key === "505") out.push({ cls: "", html: n.ottawa });
      if (layer === "cma" && entry.key === "522") out.push({ cls: "", html: n.belleville });
      return out;
    }

    // ----------------------------------------------------------------------------------------
    // Popup
    // ----------------------------------------------------------------------------------------
    let popup = null;
    function popupHtml(entry) {
      const d = entry.d, layer = state.layer, x = t();
      let html = `<div class="pp-type">${esc(areaKind(entry, layer))}</div><div class="pp-name">${esc(areaName(entry))}</div>`;
      if (d.status === "res") return html + `<div class="pp-na">${esc(x.ppReserve)}</div>`;
      if (d.status === "na") return html + `<div class="pp-na">${esc(x.ppNotPublished)}</div>`;
      if (d.status === "ca") {
        const v = CA_S.find((s) => s.y === state.year) || CA_S[CA_S.length - 1];
        return html + `<div class="pp-na">${esc(x.ppCA(pct(v.p), num(v.n), v.y))}</div>`;
      }
      const foot = [];
      if (isSurvey(layer)) {
        const v = d.s.find((s) => s.y === state.year), o = ONT_S.find((s) => s.y === state.year);
        const w = x.whoNoun.a, src = String(state.year);
        const big = state.mode === "rate" ? v.p : v.n;
        if (big != null) {
          const label = state.mode === "rate" ? x.ppPct(w, src) : x.ppNum(w, src);
          const other = state.mode === "rate" ? (v.n == null ? "" : `${num(v.n)} ${x.homes}`) : (v.p == null ? "" : pct(v.p));
          html += `<div class="pp-main"><div class="pp-big">${esc(state.mode === "rate" ? pct(big) : num(big))}</div><div class="pp-mlbl"><b>${esc(label)}</b>${other ? `<br>${esc(other)}` : ""}</div></div>`;
          if ((state.mode === "rate" ? v.pg : v.ng) === "e") foot.push(x.ppCaution(null));
        } else {
          html += `<div class="pp-main"><div class="pp-mlbl"><b>${esc(state.mode === "rate" ? x.lgTitle.rate(w, src) : x.lgTitle.count(w, src))}</b><br>${esc(x.ppGradeF)}</div></div>`;
          if (state.mode === "count" && v.p != null) {   // the number isn't published, but the share is
            html += `<div class="pp-rows"><div class="pp-row"><span>${esc(x.ppShare(src))}</span><b>${esc(pct(v.p))}</b></div></div>`;
            if (v.pg === "e") foot.push(x.ppCaution(null));
          }
        }
        html += `<div class="pp-rows"><div class="pp-row"><span>${esc(x.ppOntario(state.year))}</span><b>${esc(`${pct(o.p)} · ${num(o.n)}`)}</b></div></div>`;
        if (entry.key === "505") foot.push(x.ppOttawa);
      } else {
        const g = d.g[state.who], w = x.whoNoun[state.who];
        const label = state.mode === "rate" ? x.ppPct(w, x.census) : x.ppNum(w, x.census);
        if (g) {
          const big = state.mode === "rate" ? pct(g.p) : num(g.n);
          const other = state.mode === "rate" ? `${num(g.n)} ${x.homes}` : pct(g.p);
          html += `<div class="pp-main"><div class="pp-big">${esc(big)}</div><div class="pp-mlbl"><b>${esc(label)}</b><br>${esc(other)}</div></div>`;
        } else {
          const full = state.mode === "rate" ? x.lgTitle.rate(w, x.census) : x.lgTitle.count(w, x.census);   // no figure beside it
          html += `<div class="pp-main"><div class="pp-mlbl"><b>${esc(full)}</b><br>${esc(x.ppNA)}</div></div>`;
        }
        if (g) { const r = relNote(g, true); if (r) foot.push(r); }
        html += `<div class="pp-rows">`;
        for (const o of WHO) {
          if (o === state.who) continue;
          const h = d.g[o];
          html += `<div class="pp-row"><span>${esc(x.whoName[o])}</span><b>${esc(!h ? "–" : `${pct(h.p)} · ${num(h.n)}`)}</b></div>`;
        }
        html += `</div>`;
        if (d.est) foot.push(x.ppEst);
        if (d.tenureEst && state.who !== "a") foot.push(x.ppTenureEst);
        if (d.res) foot.push(x.ppRes(pctPlain(d.res)));
      }
      if (foot.length) html += `<div class="pp-foot">${foot.map(esc).join(" ")}</div>`;
      return html;
    }
    function openPopup(entry, lngLat) {
      if (popup) popup.remove();
      popup = new maplibregl.Popup({ closeButton: true, maxWidth: "310px", offset: 8, focusAfterOpen: false })
        .setLngLat(lngLat).setHTML(popupHtml(entry)).addTo(map);
      popup.on("close", () => { if (popup && !popup.isOpen()) popup = null; });
    }

    // ----------------------------------------------------------------------------------------
    // Side panel with charts
    // ----------------------------------------------------------------------------------------
    const BAR = { light: "#9fd0ec", mid: "#8fb2d6", main: "#245eac", dark: "#102349" };
    function stacked(segments, total) {   // value: exact (bar widths, %), shown: the number displayed
      const segs = segments.filter((s) => s.value > 0);
      const share = (s) => pct(total > 0 ? (s.value / total) * 100 : null);
      const bar = segs.map((s) => `<span style="flex-grow:${s.value};background:${s.color}" title="${esc(`${s.label}: ${s.shown} (${share(s)})`)}"></span>`).join("");
      const keys = segments.map((s) => `<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span><span class="n">${esc(s.shown)}</span><span class="p">${share(s)}</span></li>`).join("");
      const aria = segments.map((s) => `${s.label} ${s.shown} (${share(s)})`).join(", ");
      return `<div class="sbar" role="img" aria-label="${esc(aria)}">${bar}</div><ul class="keyrows">${keys}</ul>`;
    }
    function cmp(text) { return `<div class="cmp">${esc(t().ontarioCmp)} <b>${esc(text)}</b></div>`; }
    // Horizontal bars, all on the same scale: [{ label, rate, count (shown), color, caution, na (text when no rate), strong }]
    function hbars(rows, max, labelWidth) {
      const aria = rows.map((r) => `${r.label}: ${r.rate == null ? r.na : `${pct(r.rate)}${r.count ? `, ${r.count}` : ""}`}`).join("; ");
      return `<div class="hbars"${labelWidth ? ` style="--lab:${labelWidth}"` : ""} role="img" aria-label="${esc(aria)}">${rows.map((r) => r.rate == null
        ? `<div class="hbar${r.strong ? " strong" : ""}"><span class="lab">${esc(r.label)}</span><span class="track na">${esc(r.na)}</span></div>`
        : `<div class="hbar${r.strong ? " strong" : ""}"><span class="lab">${esc(r.label)}</span><span class="track"><span class="fill" style="width:${Math.max(1, (r.rate / max) * 62)}%;background-color:${r.color}"></span><span class="val">${pct(r.rate)}${r.count ? ` <span>· ${esc(r.count)}</span>` : ""}</span></span></div>`).join("")}</div>`;
    }
    const cautionKey = (rows) => {
      const list = rows.filter((r) => r.caution && r.rate != null).map((r) => r.label);
      return list.length ? `<p class="bar-key">${esc(t().cautionList(listJoin(list)))}</p>` : "";
    };
    // A survey series as bars, one per year
    function seriesRows(s, color = BAR.main) {
      return s.map((v) => ({ label: String(v.y), rate: v.p, count: v.n == null ? null : num(v.n), color, caution: v.pg === "e", na: t().notPublished }));
    }

    function ontarioTrendBlock() {
      const x = t(), last = ONT_S[ONT_S.length - 1], first = ONT_S[0];
      const highest = ONT_S.every((v) => v.p <= last.p);
      const rows = seriesRows(ONT_S);
      let html = `<section class="block"><h3>${esc(x.bTrend)}</h3>
        <div class="hero"><span class="big">${pct(last.p)}</span><span class="lbl">${esc(x.heroTrend(num(last.n), last.y, highest))}</span></div>`;
      if (last.n !== first.n) html += `<p class="sub-note">${esc(x.trendChange(num(first.n), first.y, num(Math.abs(last.n - first.n)), last.n > first.n))}</p>`;
      html += hbars(rows, Math.max(...rows.map((r) => r.rate || 0))) + cautionKey(rows) + `</section>`;
      return html;
    }
    function censusBlock(d, isOntario) {
      const x = t(), a = d.g.a, w = x.whoNoun.a;
      let html = `<section class="block"><h3>${esc(x.bCensus)}</h3>`;
      if (a) {
        html += `<div class="hero"><span class="big">${pct(a.p)}</span><span class="lbl">${esc(x.heroCensus(w, num(a.n)))}</span></div>
          ${stacked([{ label: x.segIn, value: a.n, shown: num(a.n), color: BAR.dark }, { label: x.segNotIn, value: a.hh - a.n, shown: num(a.hh - a.n), color: BAR.light }], a.hh)}`;
      }
      if (a && a.rel) html += `<div class="note warn">${esc(relNote(a, false))}</div>`;
      if (!isOntario) html += cmp(pct(ONT_C.g.a.p));
      html += `</section>`;
      // renters and owners
      html += `<section class="block"><h3>${esc(x.bTenure)}</h3>`;
      const rows = ["r", "o"].map((k) => {
        const g = d.g[k];
        return { label: x.whoName[k], rate: g ? g.p : null, count: g ? `${num(g.n)} ${x.homes}` : null,
          color: k === "r" ? BAR.dark : BAR.main, na: x.ppNA };
      });
      html += hbars(rows, Math.max(1, ...rows.map((r) => r.rate || 0), isOntario ? 0 : Math.max(ONT_C.g.r.p, ONT_C.g.o.p)), "86px");
      if (!isOntario) html += cmp(`${x.whoName.r} ${pct(ONT_C.g.r.p)} · ${x.whoName.o} ${pct(ONT_C.g.o.p)}`);
      for (const k of ["r", "o"]) {
        const g = d.g[k];
        if (g && g.rel && !isOntario) html += `<div class="note warn"><b>${esc(x.whoName[k])}:</b> ${esc(relNote(g, false))}</div>`;
      }
      html += `</section>`;
      return html;
    }

    function panelHtml(entry, layer) {
      const x = t();
      if (!entry) {   // all of Ontario
        let html = `<div class="area-eyebrow">${esc(x.allOntario)}</div><h2 class="area-name">Ontario</h2><p class="hint">${esc(x.ontarioHint)}</p>`;
        if (isSurvey(state.layer)) {
          html += ontarioTrendBlock() + metrosBlock();
        } else {
          html += censusBlock(ONT_C, true) + `<div class="note">${esc(x.censusLow)}</div>` + ontarioTrendBlock();
        }
        return html + tableHtml(null, "Ontario") + aboutHtml();
      }
      const d = entry.d;
      let html = `<div class="area-eyebrow">${esc(areaKind(entry, layer))}</div><h2 class="area-name">${esc(areaName(entry))}</h2>
        <button type="button" class="clear-btn" data-action="clear">${esc(x.showOntario)}</button>`;
      for (const n of notesFor(entry, layer)) html += `<div class="note ${n.cls}">${n.html}</div>`;
      if (d.status === "ca") return html + caBlock() + aboutHtml();
      if (d.status !== "ok") return html + aboutHtml();
      if (isSurvey(layer)) {
        const v = d.s.find((s) => s.y === state.year), o = ONT_S.find((s) => s.y === state.year);
        html += `<section class="block"><h3>${esc(x.bYear(state.year))}</h3>`;
        if (v.p != null) {
          html += `<div class="hero"><span class="big">${pct(v.p)}</span><span class="lbl">${esc(v.n == null ? x.heroYearNoNum(v.y) : x.heroYear(num(v.n), v.y))}</span></div>`;
          if (v.pg === "e") html += `<div class="note warn">${esc(x.ppCaution(null))}</div>`;
        } else html += `<div class="na-msg">${esc(x.notPublishedYear(v.y))}</div>`;
        html += cmp(`${pct(o.p)} (${o.y})`) + `</section>`;
        const rows = seriesRows(d.s);
        html += `<section class="block"><h3>${esc(x.bSeries)}</h3>${hbars(rows, Math.max(1, ...rows.map((r) => r.rate || 0)))}${cautionKey(rows)}</section>`;
        return html + tableHtml(d, areaName(entry)) + aboutHtml();
      }
      html += censusBlock(d, false);
      // the yearly figures for its metro area, if it's in one
      if (d.m && DATA.cma[d.m]) {
        const s = series(DATA.cma[d.m].s), rows = seriesRows(s);
        html += `<section class="block"><h3>${esc(x.bMetroTrend(metroName(d.m)))}</h3>${hbars(rows, Math.max(1, ...rows.map((r) => r.rate || 0)))}${cautionKey(rows)}
          ${cmp(`${pct(ONT_S[ONT_S.length - 1].p)} (${LAST_YEAR})`)}<p class="sub-note">${esc(x.metroTrendNote)}</p></section>`;
        if (d.m === "505") html += `<div class="note">${esc(x.notes.ottawa)}</div>`;
      } else {
        html += `<div class="note">${esc(x.noYearly)}</div>`;
      }
      return html + tableHtml(d, areaName(entry)) + aboutHtml();
    }
    function metrosBlock() {
      const x = t(), y = state.year;
      const rows = Object.keys(DATA.cma).map((uid) => {
        const v = series(DATA.cma[uid].s).find((s) => s.y === y);
        return { label: metroName(uid), rate: v.p, count: v.n == null ? null : num(v.n), color: BAR.main, caution: v.pg === "e", na: x.notPublished };
      }).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1) || a.label.localeCompare(b.label, t().locale));
      const o = ONT_S.find((s) => s.y === y), c = CA_S.find((s) => s.y === y);
      rows.push({ label: x.allSmallCities, rate: c.p, count: c.n == null ? null : num(c.n), color: BAR.mid, caution: c.pg === "e", na: x.notPublished, strong: true });
      rows.push({ label: "Ontario", rate: o.p, count: num(o.n), color: BAR.dark, caution: false, strong: true });
      return `<section class="block"><h3>${esc(x.bMetros(y))}</h3>${hbars(rows, Math.max(1, ...rows.map((r) => r.rate || 0)), "150px")}${cautionKey(rows)}</section>`;
    }
    function caBlock() {
      const x = t(), rows = seriesRows(CA_S, BAR.mid);
      return `<section class="block"><h3>${esc(x.bCA)}</h3>${hbars(rows, Math.max(1, ...rows.map((r) => r.rate || 0)))}${cautionKey(rows)}</section>`;
    }

    function tableHtml(d, name) {
      const x = t();
      const row = (cells) => `<tr>${cells.map((c, i) => (i ? `<td class="num">${c}</td>` : `<td>${esc(c)}</td>`)).join("")}</tr>`;
      let body = "";
      if (!d || !isSurvey(d.layer)) {   // census: everyone, renters, owners
        const c = d || ONT_C;
        body += `<tr><th>${esc(x.census)}</th><th class="num">${esc(x.rowsCensus.inNeed)}</th><th class="num">${esc(x.rowsCensus.examined)}</th></tr>`;
        for (const k of WHO) {
          const g = c.g[k];
          const inNeed = !g ? "–" : `${num(g.n)}<span class="tp">${pct(g.p)}</span>`;
          body += row([x.whoName[k], inNeed, g?.hh == null ? "–" : num(g.hh)]);
        }
      }
      if (!d || isSurvey(d.layer)) {   // yearly survey: share, homes, reliability
        const s = d ? d.s : ONT_S;
        body += `<tr><th>${esc(d ? name : x.bTrend)}</th><th class="num">${esc(x.rowsSurvey.pct)}</th><th class="num">${esc(x.rowsSurvey.num)}</th></tr>`;
        const np = `<span class="np">${esc(x.notPublished)}</span>`;
        for (const v of s) body += row([String(v.y), v.p == null ? np : pct(v.p), v.n == null ? np : num(v.n)]);
      }
      return `<details class="more"><summary>${esc(x.allFigures)}</summary><table class="all"><tbody>${body}</tbody></table></details>`;
    }
    function aboutHtml() { return `<div class="about">${t().about.map((p) => `<p>${p}</p>`).join("")}</div>`; }

    function renderPanel() {
      const sel = state.selected;
      const entry = sel ? byId[sel.layer].get(sel.id) : null;
      $("panelBody").innerHTML = panelHtml(entry, sel?.layer);
    }
    $("panelBody").addEventListener("click", (e) => {
      if (e.target.closest('[data-action="clear"]')) select(null);
    });

    // ----------------------------------------------------------------------------------------
    // Selecting areas (click or search)
    // ----------------------------------------------------------------------------------------
    function select(id, lngLat) {
      const prev = state.selected;
      if (prev && map.getSource(prev.layer)) map.setFeatureState({ source: prev.layer, id: prev.id }, { selected: false });
      if (id == null) {
        state.selected = null;
        if (popup) { popup.remove(); popup = null; }
        renderPanel();
        return;
      }
      state.selected = { layer: state.layer, id };
      map.setFeatureState({ source: state.layer, id }, { selected: true });
      const entry = byId[state.layer].get(id);
      openPopup(entry, lngLat || entry.lp);
      renderPanel();
    }
    function bboxOf(geom) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const walk = (c) => { if (typeof c[0] === "number") { minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]); minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]); } else c.forEach(walk); };
      walk(geom.coordinates);
      return [[minX, minY], [maxX, maxY]];
    }
    const MAX_ZOOM_TO = { ped: 10.5, csd: 11.5, cma: 10 };
    function selectAndShow(id) {
      const entry = byId[state.layer].get(id);
      select(id, entry.lp);
      const cam = map.cameraForBounds(bboxOf(entry.feat.geometry), { padding: { ...ontarioPadding(), top: 90, bottom: 40 } });
      if (cam) map.easeTo({ center: cam.center, zoom: Math.min(cam.zoom, MAX_ZOOM_TO[state.layer]), duration: 900 });
    }
    map.on("click", (e) => {
      if (!map.getLayer(`${state.layer}-fill`)) return;
      const hit = map.queryRenderedFeatures(e.point, { layers: [`${state.layer}-fill`] })[0];
      select(hit ? hit.id : null, e.lngLat);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && popup) popup.remove(); });

    // ----------------------------------------------------------------------------------------
    // Search by name (English or French)
    // ----------------------------------------------------------------------------------------
    const input = $("searchInput"), box = $("suggestions");
    // The page around an embedded map can ask for the search box (e.g. a "Search your riding" link).
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || !e.data || e.data.type !== "map:focus-search") return;
      try { input.focus({ preventScroll: true }); } catch { input.focus(); }
    });
    let matches = [], active = -1;
    const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[—–-]/g, " ").toLowerCase();
    function searchEntries() {
      const x = t();
      return [...byId[state.layer].entries()].map(([id, e]) => ({
        id, label: areaName(e), alt: e.nm.alt, ok: e.d.status === "ok",
        // told apart when two areas share a name (Hamilton the city and the township; the two parts of a reserve)
        tag: state.layer === "csd" ? x.csdTypes[e.nm.type] || "" : state.layer === "cma" ? (e.nm.type === "metro" ? x.metro : x.smallCity) : "",
      }));
    }
    function showMatches() {
      const q = fold(input.value.trim());
      if (!q || !SRC[state.layer]) { closeBox(); return; }
      matches = searchEntries().filter((e) => fold(e.label).includes(q) || fold(e.alt).includes(q))
        .sort((a, b) => (fold(a.label).startsWith(q) ? 0 : 1) - (fold(b.label).startsWith(q) ? 0 : 1) || a.label.localeCompare(b.label, t().locale) || b.ok - a.ok)
        .slice(0, 12);
      active = matches.length ? 0 : -1;
      box.innerHTML = matches.length
        ? matches.map((m, i) => `<div role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === active}">${esc(m.label)}${m.tag ? `<span class="opt-tag"> · ${esc(m.tag)}</span>` : ""}</div>`).join("")
        : `<div class="empty">${esc(t().noMatch)}</div>`;
      box.style.display = "block";
      input.setAttribute("aria-expanded", "true");
      input.setAttribute("aria-activedescendant", active >= 0 ? `opt-${active}` : "");
    }
    function closeBox() { box.style.display = "none"; input.setAttribute("aria-expanded", "false"); }
    function choose(i) {
      const m = matches[i];
      if (!m) return;
      input.value = m.label;
      closeBox();
      selectAndShow(m.id);
    }
    input.addEventListener("input", showMatches);
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!matches.length) return;
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
        box.querySelectorAll('[role="option"]').forEach((o, i) => o.setAttribute("aria-selected", i === active));
        input.setAttribute("aria-activedescendant", `opt-${active}`);
        box.querySelector(`#opt-${active}`)?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (active >= 0) choose(active);
      } else if (e.key === "Escape") closeBox();
    });
    box.addEventListener("mousedown", (e) => { const o = e.target.closest('[role="option"]'); if (o) { e.preventDefault(); choose(+o.dataset.i); } });
    document.addEventListener("click", (e) => { if (!box.contains(e.target) && e.target !== input) closeBox(); });

    // ----------------------------------------------------------------------------------------
    // Riding / municipality / metro area switch
    // ----------------------------------------------------------------------------------------
    $("geoToggle").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b || b.dataset.layer === state.layer) return;
      select(null);
      setHover(null);
      state.layer = b.dataset.layer;
      input.value = "";
      closeBox();
      refresh();
      if (!SRC[state.layer]) showLoading(true);
    });
    function showLoading(on, text) {
      const el = $("loading");
      el.textContent = text || t().loading;
      el.style.display = on ? "block" : "none";
    }

    // ----------------------------------------------------------------------------------------
    // "Zoom to Toronto" button (in the header)
    // ----------------------------------------------------------------------------------------
    // The City of Toronto (census subdivision 3520005), from its outline in on_csd.geojson:
    // [[west, south], [east, north]].
    const TORONTO_BOUNDS = [[-79.6393, 43.5603], [-79.1135, 43.8555]];
    $("zoomToronto").addEventListener("click", () => {
      // Fit the city into the open part of the map: right of the options card on wide screens, and clear of
      // the buttons down the right-hand side. In a narrow window, the city may go under those buttons rather
      // than shrink further; it only goes under the options card if there's almost no room beside it.
      const box = $("map").getBoundingClientRect(), card = $("layerCard").getBoundingClientRect();
      const gap = narrowScreen() ? 12 : 24;
      const beside = narrowScreen() ? 0 : Math.max(0, card.right - box.left);
      let left = beside + gap, right = gap + 40;
      if (box.width - left - right < 200) right = gap;
      if (box.width - left - right < 120) left = gap;
      const cam = map.cameraForBounds(TORONTO_BOUNDS, { padding: { top: gap, bottom: gap, left, right } });
      if (cam) map.easeTo({ center: cam.center, zoom: cam.zoom, duration: 900 });
    });

    // ----------------------------------------------------------------------------------------
    // Language and refresh
    // ----------------------------------------------------------------------------------------
    function applyStaticText() {
      const x = t();
      $("txtTitle").textContent = x.title;
      $("txtSub").textContent = x.sub;
      document.querySelectorAll("#geoToggle button").forEach((b) => {
        b.textContent = x.byLayer[b.dataset.layer];
        b.setAttribute("aria-pressed", b.dataset.layer === state.layer);
      });
      $("geoToggle").setAttribute("aria-label", x.areasLabel);
      $("txtZoomToronto").textContent = x.zoomToronto;
      $("txtShowOnMap").textContent = x.showOnMap;
      $("txtYear").textContent = x.yearLabel;
      $("txtWho").textContent = x.whoLabel;
      $("txtShadeBy").textContent = x.shadeBy;
      input.placeholder = x.search[state.layer];
      input.setAttribute("aria-label", input.placeholder);
    }
    function refresh() {
      applyStaticText();
      renderControls();
      updateMapStyle();
      renderLegend();
      renderPanel();
      $("layerCard").classList.add("ready");   // options, shading switch and legend are all in place
      if (popup && state.selected) popup.setHTML(popupHtml(byId[state.selected.layer].get(state.selected.id)));
    }
    const overlay = {
      setLanguage(next) {
        L = next;
        if (input.value) input.value = "";
        closeBox();
        refresh();
      },
    };

    // ----------------------------------------------------------------------------------------
    // Start
    // ----------------------------------------------------------------------------------------
    refresh();
    // Ctrl + scroll (and trackpad pinch, which browsers send as Ctrl + scroll) zooms the map while the pointer
    // is over the map itself, and over an area's popup (passed on to the map, as if the popup weren't there).
    // Anywhere else (header, side panel, options card, map buttons, attribution) the browser would zoom the
    // whole page instead, which is easy to do by accident, so it's switched off there. Where the plain wheel
    // zooms the map (see needCooperative), it does so over a popup too.
    document.addEventListener("wheel", (e) => {
      if (map.getCanvasContainer().contains(e.target)) return;   // the map handles it
      const overPopup = e.target.closest?.(".maplibregl-popup");
      if (!e.ctrlKey && !(overPopup && !map.cooperativeGestures.isEnabled())) return;   // ordinary scrolling
      e.preventDefault();
      if (overPopup) {
        map.getCanvas().dispatchEvent(new WheelEvent("wheel", {
          deltaX: e.deltaX, deltaY: e.deltaY, deltaZ: e.deltaZ, deltaMode: e.deltaMode,
          clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY,
          ctrlKey: e.ctrlKey, metaKey: e.metaKey, shiftKey: e.shiftKey, altKey: e.altKey, bubbles: true, cancelable: true,
        }));
      }
    }, { passive: false });

    // Two-finger gestures on phones and tablets. Pinching the page by accident (over the options card, the
    // header or the details) zooms the whole page, which is confusing next to a map that zooms on its own, so
    // it's switched off everywhere but the map: by touch-action in the CSS, and here too for browsers that don't
    // fully follow it. The browser's own zoom setting still zooms the page. Over an area's popup, two fingers
    // move and zoom the map, as if the popup weren't there. (MapLibre only listens for touches that start on
    // the map itself, so this is done here.)
    const canvasBox = map.getCanvasContainer(), mapEl = map.getContainer();
    const onPopup = (el) => !!el?.closest?.(".maplibregl-popup");
    let pinch = null;   // the two-finger gesture under way over a popup
    function fingers(e) {
      const r = canvasBox.getBoundingClientRect(), [a, b] = e.touches;
      return {
        mid: [(a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top],
        dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
      };
    }
    function syncPinch(e) {   // on every finger down or up: start, restart or end the gesture
      const ts = [...e.touches];
      const ours = ts.length === 2 && ts.some((t) => onPopup(t.target)) && ts.every((t) => mapEl.contains(t.target));
      if (!ours) {
        if (pinch?.panWasOn) map.dragPan.enable();
        pinch = null;
        return;
      }
      if (!pinch) {
        map.stop();
        // A finger on the map beside the popup would otherwise move the map too. Switching the map's own
        // dragging off and on again also stops it jumping when the popup finger lifts.
        const panWasOn = map.dragPan.isEnabled();
        if (panWasOn) map.dragPan.disable();
        pinch = { panWasOn };
      }
      const f = fingers(e);
      Object.assign(pinch, { dist: f.dist, zoom: map.getZoom(), at: map.unproject(f.mid) });
    }
    function movePinch(e) {
      const f = fingers(e);
      if (f.dist > 0 && pinch.dist > 0) map.jumpTo({ zoom: pinch.zoom + Math.log2(f.dist / pinch.dist) });
      for (let i = 0; i < 2; i++) {   // then put the place first under the fingers back under them
        const p = map.project(pinch.at), c = map.project(map.getCenter());
        const dx = p.x - f.mid[0], dy = p.y - f.mid[1];
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) break;
        map.jumpTo({ center: map.unproject([c.x + dx, c.y + dy]) });
      }
    }
    for (const type of ["touchstart", "touchend", "touchcancel"]) document.addEventListener(type, syncPinch, { capture: true, passive: true });
    document.addEventListener("touchmove", (e) => {
      if (e.touches.length < 2) return;   // one finger scrolls the page (or moves the map, where it does that)
      if (pinch) { e.preventDefault(); movePinch(e); }
      else if (!canvasBox.contains(e.target)) e.preventDefault();   // over the map, the map handles it
    }, { capture: true, passive: false });
    // Safari's own pinch gesture events
    for (const type of ["gesturestart", "gesturechange"]) {
      document.addEventListener(type, (e) => { if (!canvasBox.contains(e.target)) e.preventDefault(); }, { passive: false });
    }

    // Keep the map's drawing surface the same size as its box. If the box changes size around the time the
    // map is created (e.g. the header wraps onto another line), MapLibre can miss it; the map is then drawn
    // stretched and the mouse lands on the wrong area. So resize when (and only when) the two differ: an
    // unneeded resize before the map's first frame paints the basemap's near-white space glow behind an
    // empty map, which shows as a white flash while the page loads.
    const mapBox = document.getElementById("map");
    function fitCanvasToBox() {
      const c = map.getCanvas();
      // Redraw at once (as MapLibre does itself): resizing clears the canvas, and an empty frame flashes.
      if (Math.abs(c.clientWidth - mapBox.clientWidth) > 0.5 || Math.abs(c.clientHeight - mapBox.clientHeight) > 0.5) map.resize().redraw();
    }
    new ResizeObserver(fitCanvasToBox).observe(mapBox);
    map.once("load", fitCanvasToBox);
    // A browser window can be narrowed to phone width (or widened back), so keep the scroll behaviour in step.
    window.matchMedia("(max-width: 860px)").addEventListener("change", () => {
      if (needCooperative()) map.cooperativeGestures.enable(); else map.cooperativeGestures.disable();
    });

    // Opening view: Ontario centred in the open part of the map (between the options card and the right edge),
    // with equal gaps above and below, and equal gaps left and right. Fitting a lat/long box doesn't do this on
    // the globe (its corners aren't where Ontario's edges appear), so measure where Ontario's outline actually
    // lands on screen and adjust until it sits in the middle.
    function centreOntario() {
      const box = mapBox.getBoundingClientRect(), card = document.getElementById("layerCard").getBoundingClientRect();
      const gap = narrowScreen() ? 12 : 24;
      const left = narrowScreen() ? 0 : Math.max(0, card.right - box.left);
      const area = { x0: left + gap, x1: box.width - gap, y0: gap, y1: box.height - gap };
      for (let i = 0; i < 8; i++) {
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        for (const p of DATA.outline) { const q = map.project(p); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
        const scale = Math.min((area.x1 - area.x0) / (x1 - x0), (area.y1 - area.y0) / (y1 - y0));
        const dx = (x0 + x1) / 2 - (area.x0 + area.x1) / 2, dy = (y0 + y1) / 2 - (area.y0 + area.y1) / 2;
        if (Math.abs(Math.log2(scale)) < 0.001 && Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) break;
        const c = map.project(map.getCenter());
        map.jumpTo({ center: map.unproject([c.x + dx, c.y + dy]), zoom: map.getZoom() + Math.log2(scale) });
      }
    }
    if (!startedWithView) {
      if (map.style?._loaded) centreOntario();
      else map.once("style.load", centreOntario);   // after the basemap has switched on the globe
    }
    const mapLoaded = new Promise((resolve) => (map.loaded() ? resolve() : map.once("load", resolve)));
    async function loadLayer(layer, request) {
      try {
        const [geojson] = await Promise.all([request, mapLoaded]);
        SRC[layer] = prepare(geojson, layer);
        if (!map.hasImage("chn-hatch")) map.addImage("chn-hatch", hatchImage(), { pixelRatio: 2 });

        addLayersFor(layer);
        if (state.layer === layer) showLoading(false);
        refresh();
      } catch (err) {
        console.error(err);
        if (state.layer === layer) showLoading(true, t().loadError);
      }
    }
    showLoading(true);
    loadLayer("ped", boundaryRequests.ped).then(() => loadLayer("csd", boundaryRequests.csd)).then(() => loadLayer("cma", boundaryRequests.cma));
  </script>
</body>
</html>
