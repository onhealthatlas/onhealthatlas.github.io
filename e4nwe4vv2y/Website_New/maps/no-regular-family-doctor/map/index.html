    // ----------------------------------------------------------------------------------------
    // Measures
    // ----------------------------------------------------------------------------------------
    const GROUPS = ["a", "k", "d"];
    const YEARS = ["2020", "2022", "chg"];
    // A metric is "<group>_<year>_<mode>", e.g. a_2022_rate (share of everyone, 2022) or k_chg_count.
    // kind: pct (share, 0–100), pts (change in percentage points), count, dcount (change in number).
    // Values are grouped into colours exactly as they are displayed (shares and points to 1 decimal).
    const UNIT = { pct: 0.1, pts: 0.1, count: 1, dcount: 1 };
    const DIGITS = { pct: 1, pts: 1, count: 0, dcount: 0 };
    const roundAs = (v, kind) => (v == null ? null : Number((Math.round(v / UNIT[kind]) * UNIT[kind]).toFixed(DIGITS[kind])));
    const kindOf = (year, mode) => (year === "chg" ? (mode === "rate" ? "pts" : "dcount") : (mode === "rate" ? "pct" : "count"));
    const METRICS = [];
    for (const g of GROUPS) for (const y of YEARS) for (const m of ["rate", "count"]) METRICS.push({ key: `${g}_${y}_${m}`, kind: kindOf(y, m) });
    const KIND = Object.fromEntries(METRICS.map((m) => [m.key, m.kind]));
    // Shades from least to most severe: the same five muted steel blues as the family doctors map, from a
    // mid-blue (no shade reads as "fine") to near-black. Shares use fixed steps, the same for both years and
    // every group, so 2020 and 2022 can be compared directly; 18%, nearly 1 in 5, is the second-darkest.
    const RAMP = ["#407eb7", "#305d92", "#203e6b", "#122342", "#070c17"];
    const FELL_COLOR = "#b7cbe0";   // change maps: fell or no change (a pale blue, set apart from the rising shades)
    const NODATA_COLOR = "#e6e7e3";
    const PCT_BREAKS = [10, 12.5, 15, 20];
    const PTS_BREAKS = [0.1, 2, 4, 6];   // below 0.1 points: fell or no change

    // Riding counts are estimates, so they're shown to the nearest 10 (22,900, not 22,902); the popup and
    // side panel say they're estimates.
    const round10 = (v) => (v == null ? null : Math.round(v / 10) * 10);
    // All derived figures for one area. layer: "ped" (riding), "fsa" (postal area) or "ontario".
    function derive(rec, layer) {
      if (!rec) return { hasData: false };
      const r = { hasData: true, layer, est: layer === "ped", g: {} };
      const shown = layer === "ped" ? round10 : (v) => v;
      for (const g of GROUPS) {
        const v = rec[g] || [null, null, null, null];
        const x = { u20: v[0], t20: v[1], u22: v[2], t22: v[3] };
        // shown counts (riding counts to the nearest 10; "with" = total minus without, so they add up)
        x.n = { u20: shown(x.u20), t20: shown(x.t20), u22: shown(x.u22), t22: shown(x.t22) };
        x.n.w20 = x.n.t20 == null ? null : x.n.t20 - x.n.u20;
        x.n.w22 = x.n.t22 == null ? null : x.n.t22 - x.n.u22;
        x.r20 = x.t20 > 0 ? (x.u20 / x.t20) * 100 : null;
        x.r22 = x.t22 > 0 ? (x.u22 / x.t22) * 100 : null;
        // Change worked out from the figures as shown, so "15.6% → 18.3%" always reads as +2.7 points.
        x.chgRate = x.r20 != null && x.r22 != null ? Number((roundAs(x.r22, "pct") - roundAs(x.r20, "pct")).toFixed(1)) : null;
        x.chgCount = x.n.u20 != null && x.n.u22 != null ? x.n.u22 - x.n.u20 : null;
        r.g[g] = x;
        r[`${g}_2020_rate`] = x.r20; r[`${g}_2020_count`] = x.r20 == null ? null : x.n.u20;
        r[`${g}_2022_rate`] = x.r22; r[`${g}_2022_count`] = x.r22 == null ? null : x.n.u22;
        r[`${g}_chg_rate`] = x.chgRate; r[`${g}_chg_count`] = x.chgRate == null ? null : x.chgCount;
      }
      r.withheld = GROUPS.some((g) => r.g[g].r20 == null || r.g[g].r22 == null);
      r.small = layer === "fsa" && r.g.a.t22 != null && r.g.a.t22 < 1000;
      r.rid = rec.rid || null;
      r.parts = rec.parts || null;
      return r;
    }
    const ONTARIO = derive(DATA.ont, "ontario");

    // ----------------------------------------------------------------------------------------
    // Number formatting
    // ----------------------------------------------------------------------------------------
    let L = lang;   // the overlay's language, kept in step with the basemap's EN/FR button
    const t = () => T[L];
    const nf = {};
    function fmt(v, kind, opts = {}) {
      if (v == null || Number.isNaN(v)) return "–";
      const digits = opts.digits ?? DIGITS[kind] ?? 0;
      const key = `${L}|${digits}`;
      if (!nf[key]) nf[key] = new Intl.NumberFormat(t().locale, { minimumFractionDigits: digits, maximumFractionDigits: digits });
      const sign = (kind === "pts" || kind === "dcount") && opts.sign !== false ? (v > 0 ? "+" : v < 0 ? "−" : "") : "";
      const s = sign + nf[key].format(sign ? Math.abs(v) : v);
      if (kind === "pct") return s + (L === "fr" ? " %" : "%");
      if (kind === "pts" && opts.unit !== false) return t().points(s);
      return s;
    }
    // A count as shown (riding counts are already rounded to the nearest 10; see derive).
    const fmtN = (v, est, kind = "count") => (v == null ? "–" : fmt(v, kind));

    // ----------------------------------------------------------------------------------------
    // Classes
    // ----------------------------------------------------------------------------------------
    // Shares and changes in points use the fixed steps above. Numbers (which depend on each area's size)
    // are split into five groups of roughly equal size, rounded to tidy numbers.
    function tidy(v) {
      if (v <= 0) return v;
      const mag = 10 ** Math.floor(Math.log10(v));
      const sig = v / mag >= 3 ? 1 : 2;   // 2 significant figures below 3×10^n, 1 above (e.g. 2,400 / 30,000)
      const step = Math.max(1, mag / (sig === 2 ? 10 : 2));
      return Math.round(v / step) * step;
    }
    function quantileBreaks(values, k) {
      const sorted = values.slice().sort((a, b) => a - b);
      const q = (i) => sorted[Math.min(sorted.length - 1, Math.floor((sorted.length * i) / k))];
      const breaks = [];
      for (let i = 1; i < k; i++) {
        const b = tidy(q(i));
        if (b > sorted[0] && b <= sorted[sorted.length - 1] && b > (breaks[breaks.length - 1] ?? -Infinity)) breaks.push(b);
      }
      return breaks;
    }
    // { breaks, colors, fell }: colors[i] is for values from breaks[i-1] up to breaks[i]; fell = the first
    // class holds decreases (change maps), shown in FELL_COLOR.
    const classCache = {};
    function classesFor(layer, metric) {
      const ck = `${layer}|${metric}`;
      if (classCache[ck]) return classCache[ck];
      const kind = KIND[metric];
      let out;
      if (kind === "pct") out = { breaks: PCT_BREAKS, colors: RAMP.slice(), fell: false };
      else if (kind === "pts") out = { breaks: PTS_BREAKS, colors: [FELL_COLOR, ...rampFor(4)], fell: true };
      else {
        const values = allDerived(layer).map((d) => d[metric]).filter((v) => v != null);
        if (kind === "count") {
          const breaks = quantileBreaks(values, RAMP.length);
          out = { breaks, colors: rampFor(breaks.length + 1), fell: false };
        } else {   // change in number: decreases get their own class, the increases are split into four
          const ups = values.filter((v) => v > 0);
          const breaks = quantileBreaks(ups, 4);
          const anyFell = values.some((v) => v <= 0);
          out = anyFell
            ? { breaks: [1, ...breaks.filter((b) => b > 1)], colors: [FELL_COLOR, ...rampFor(breaks.filter((b) => b > 1).length + 1)], fell: true }
            : { breaks, colors: rampFor(breaks.length + 1), fell: false };
        }
      }
      return (classCache[ck] = out);
    }
    // Pick k colours from the ramp, always keeping both ends, ordered lighter -> darker.
    function rampFor(k) {
      if (k >= RAMP.length) return RAMP.slice();
      return Array.from({ length: k }, (_, i) => RAMP[Math.round((i * (RAMP.length - 1)) / Math.max(1, k - 1))]);
    }

    // ----------------------------------------------------------------------------------------
    // Overlay state and map layers
    // ----------------------------------------------------------------------------------------
    const state = { layer: "ped", year: "2022", who: "a", mode: "rate", selected: null, hover: null };
    const SRC = { ped: null, fsa: null };   // GeoJSON with derived properties, once loaded
    const byId = { ped: new Map(), fsa: new Map() };
    const metricKey = () => `${state.who}_${state.year}_${state.mode}`;
    const ridingName = {};   // ED_ID -> { en, fr }, filled in when the riding boundaries arrive

    function prepare(geojson, layer) {
      const features = geojson.features.map((f, i) => {
        const p = f.properties;
        const key = layer === "ped" ? String(p.ED_ID) : p.CFSAUID;
        const d = derive(DATA[layer][key], layer);
        if (layer === "ped") ridingName[p.ED_ID] = { en: p.ENGLISH_NA, fr: p.FRENCH_NAM };
        const props = { key, hasData: d.hasData, name: layer === "ped" ? p.ENGLISH_NA : p.CFSAUID, name_fr: layer === "ped" ? p.FRENCH_NAM : p.CFSAUID };
        for (const m of METRICS) if (d[m.key] != null) props[m.key] = roundAs(d[m.key], m.kind);
        const feat = { type: "Feature", id: i, properties: props, geometry: f.geometry };
        byId[layer].set(i, { feat, d, key, lp: DATA.lp[layer][key] });
        return feat;
      });
      return { type: "FeatureCollection", features };
    }

    // Every area's figures, worked out from the built-in data alone, so the legend can be drawn before the
    // boundary files arrive.
    const derivedAll = {};
    const allDerived = (layer) => (derivedAll[layer] ||= Object.values(DATA[layer]).map((rec) => {
      const d = derive(rec, layer);
      for (const m of METRICS) if (d[m.key] != null) d[m.key] = roundAs(d[m.key], m.kind);
      return d;
    }));

    function fillExpression(layer, metric) {
      const { breaks, colors } = classesFor(layer, metric);
      const step = ["step", ["to-number", ["get", metric]], colors[0]];
      breaks.forEach((b, i) => step.push(b, colors[i + 1]));
      return ["case", ["has", metric], step, NODATA_COLOR];
    }

    function hatchImage() {      // diagonal lines for areas where a figure isn't available
      const size = 16, c = document.createElement("canvas");
      c.width = c.height = size;
      const g = c.getContext("2d");
      g.fillStyle = NODATA_COLOR; g.fillRect(0, 0, size, size);
      g.strokeStyle = "#7d858f"; g.lineWidth = 2.2;
      for (const o of [-size, 0, size]) { g.beginPath(); g.moveTo(o, size); g.lineTo(o + size, 0); g.stroke(); }
      return g.getImageData(0, 0, size, size);
    }

    // The data layers go above the roads and below the basemap's borders and labels, with a copy of the
    // water on top so lakes and rivers still read as water. The hover and selection outlines go above the
    // borders (so a riding on the Manitoba, Quebec or US border is outlined all the way round), still below
    // the labels.
    function addLayersFor(layer) {
      const labels = map.getStyle().layers.find((l) => l.type === "symbol")?.id;
      const before = map.getLayer("boundary_3") ? "boundary_3" : labels;
      map.addSource(layer, { type: "geojson", data: SRC[layer], tolerance: 0.25, buffer: 128 });   // simplification stays under a quarter pixel at every zoom
      const vis = { visibility: state.layer === layer ? "visible" : "none" };
      if (!map.getLayer("water-over-data")) {
        const water = map.getStyle().layers.find((l) => l.id === "water");
        if (water) map.addLayer({ ...water, id: "water-over-data" }, before);
      }
      const fillsBefore = map.getLayer("water-over-data") ? "water-over-data" : before;
      map.addLayer({ id: `${layer}-fill`, type: "fill", source: layer, layout: vis,
        paint: { "fill-color": NODATA_COLOR, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 8, 1, 10, 0.86, 12, 0.74, 15, 0.6] } }, fillsBefore);   // solid when zoomed out, so the dark shades stay distinct
      map.addLayer({ id: `${layer}-hatch`, type: "fill", source: layer, layout: vis,
        filter: ["literal", false], paint: { "fill-pattern": "att-hatch", "fill-opacity": 0.9 } }, fillsBefore);
      map.addLayer({ id: `${layer}-line`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-opacity": 0.8,
          "line-width": ["interpolate", ["linear"], ["zoom"], 4, layer === "ped" ? 0.6 : 0.3, 8, layer === "ped" ? 1.1 : 0.7, 12, 1.8] } }, before);
      map.addLayer({ id: `${layer}-hover`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-width": 2.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "hover"], false], 1, 0] } }, labels);
      // Selection: a dark casing under a white line, visible on both light and black fills.
      map.addLayer({ id: `${layer}-sel-casing`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#000000", "line-width": 5.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "selected"], false], 0.75, 0] } }, labels);
      map.addLayer({ id: `${layer}-sel`, type: "line", source: layer, layout: { ...vis, "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-width": 2.5,
          "line-opacity": ["case", ["boolean", ["feature-state", "selected"], false], 1, 0] } }, labels);

      map.on("mousemove", `${layer}-fill`, (e) => {
        if (state.layer !== layer || !e.features.length) return;
        setHover(e.features[0].id);
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", `${layer}-fill`, () => { setHover(null); map.getCanvas().style.cursor = ""; });
    }

    function setHover(id) {
      const cur = state.hover;
      if (cur && cur.id === id && cur.layer === state.layer) return;
      if (cur && map.getSource(cur.layer)) map.setFeatureState({ source: cur.layer, id: cur.id }, { hover: false });
      state.hover = id == null ? null : { layer: state.layer, id };
      if (id != null) map.setFeatureState({ source: state.layer, id }, { hover: true });
    }

    function updateMapStyle() {
      const layer = state.layer, metric = metricKey();
      if (!SRC[layer] || !map.getLayer(`${layer}-fill`)) return;
      map.setPaintProperty(`${layer}-fill`, "fill-color", fillExpression(layer, metric));
      // hatched: the area is in the source but this figure wasn't released
      map.setFilter(`${layer}-hatch`, ["all", ["==", ["get", "hasData"], true], ["!", ["has", metric]]]);
      for (const l of ["ped", "fsa"]) {
        if (!map.getLayer(`${l}-fill`)) continue;
        for (const part of ["fill", "hatch", "line", "hover", "sel-casing", "sel"]) {
          map.setLayoutProperty(`${l}-${part}`, "visibility", l === layer ? "visible" : "none");
        }
      }
    }

    // ----------------------------------------------------------------------------------------
    // Controls: year, who, shading, legend
    // ----------------------------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    function renderControls() {
      const x = t();
      for (const [id, attr, labels, cur] of [["yearToggle", "year", x.yearBtn, state.year], ["whoToggle", "who", x.whoBtn, state.who],
        ["modeToggle", "mode", { rate: x.modeRate, count: x.modeCount }, state.mode]]) {
        $(id).querySelectorAll("button").forEach((b) => {
          b.textContent = labels[b.dataset[attr]];
          b.setAttribute("aria-pressed", b.dataset[attr] === cur);
        });
      }
    }
    for (const [id, attr] of [["yearToggle", "year"], ["whoToggle", "who"], ["modeToggle", "mode"]]) {
      $(id).addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b || b.dataset[attr] === state[attr]) return;
        state[attr] = b.dataset[attr];
        refresh();
      });
    }

    // Each class runs from its lower bound up to one display step below the next class:
    // "15% – 19.9%", "+2 – 3.9 points", "1,000 – 1,999". Lower bounds that are whole numbers drop the ".0".
    function legendLabel(i, cls, kind) {
      const { breaks, fell } = cls;
      const x = t();
      const lower = (v) => fmt(v, kind, { digits: Number.isInteger(v) ? 0 : DIGITS[kind], sign: false, unit: false });
      const upper = (v) => fmt(v, kind, { sign: false, unit: false });
      const below = (v) => Number((v - UNIT[kind]).toFixed(DIGITS[kind]));
      if (i === 0 && fell) return x.fell;
      const lo = i === 0 ? null : breaks[i - 1];
      const change = kind === "pts" || kind === "dcount";
      if (i === breaks.length) return kind === "pts" ? x.ptsOrMore(lower(lo)) : change ? x.upOrMore(lower(lo)) : x.orMore(lower(lo));
      if (i === 0) return x.under(change ? `+${lower(breaks[0])}` : lower(breaks[0]));
      const hi = below(breaks[i]);
      if (hi <= lo) return change ? `+${lower(lo)}` : x.exactly(lower(lo));
      return kind === "pts" ? x.ptsRange(lower(lo), upper(hi)) : change ? x.upRange(lower(lo), upper(hi)) : x.range(lower(lo), upper(hi));
    }

    function renderLegend() {
      const el = $("legend"), x = t();
      const metric = metricKey(), kind = KIND[metric], cls = classesFor(state.layer, metric);
      const w = x.whoNoun[state.who], wDe = x.whoDe?.[state.who];   // wDe: French only
      const rows = cls.colors.map((c, i) => ({ c, label: legendLabel(i, cls, kind) })).reverse();   // darkest (worst) first
      let naRows = "";
      if (allDerived(state.layer).some((d) => d[metric] == null)) naRows += `<div class="lg-row"><span class="sw sw-na"></span>${esc(x.legendNA)}</div>`;
      // areas on the map that the source doesn't list: known once the boundaries are in; until then, only postal areas have any
      const anyNoData = SRC[state.layer] ? [...byId[state.layer].values()].some(({ d }) => !d.hasData) : state.layer === "fsa";
      if (anyNoData) naRows += `<div class="lg-row"><span class="sw sw-nodata"></span>${esc(x.legendNoData)}</div>`;
      const title = state.year === "chg"
        ? (state.mode === "rate" ? x.lgTitle.chgRate(w, wDe) : x.lgTitle.chgCount(w, wDe))
        : (state.mode === "rate" ? x.lgTitle.rate(w, state.year, wDe) : x.lgTitle.count(w, state.year, wDe));
      const desc = state.year === "chg"
        ? (state.mode === "rate" ? x.lgDesc.chgRate : x.lgDesc.chgCount)
        : (state.mode === "rate" ? x.lgDesc.rate(w, state.year) : x.lgDesc.count(w, state.year, wDe));
      el.innerHTML = `<div class="lg-title">${esc(title)}</div>
        <div class="lg-caption">${esc(state.year === "chg" ? x.lgCaption.chg : x.lgCaption.level)}</div>
        <div class="lg-rows">${rows.map((r) => `<div class="lg-row"><span class="sw" style="background:${r.c}"></span>${esc(r.label)}</div>`).join("")}</div>
        ${naRows ? `<div class="lg-extra">${naRows}</div>` : ""}
        <p class="lg-desc">${esc(desc)}</p>`;
    }

    // ----------------------------------------------------------------------------------------
    // Names and notes
    // ----------------------------------------------------------------------------------------
    const rName = (ed) => (ridingName[ed] ? (L === "fr" ? ridingName[ed].fr : ridingName[ed].en) : String(ed));
    function areaName(entry) {
      const p = entry.feat.properties;
      return L === "fr" ? p.name_fr || p.name : p.name;
    }
    const areaKind = (layer) => (layer === "ped" ? t().riding : t().postalArea);
    const listJoin = (items) => items.length < 2 ? items.join("") : `${items.slice(0, -1).join(", ")} ${t().and} ${items[items.length - 1]}`;
    const pctPlain = (v) => fmt(v, "pct", { digits: 0 });
    function notesFor(entry, layer) {
      const d = entry.d, n = t().notes, name = esc(areaName(entry)), out = [];
      if (!d.hasData) return [{ cls: "", html: n.noData(name) }];
      if (layer === "ped" && d.parts) {
        const parts = d.parts.filter(([, s]) => s >= 1);
        const whole = parts.every(([, s]) => s >= 100);
        const shown = parts.slice(0, 14).map(([code, s]) => (s >= 100 || whole ? `<b>${esc(code)}</b>` : `<b>${esc(code)}</b> (${pctPlain(s)})`));
        if (parts.length > 14) shown.push(n.more(parts.length - 14));
        out.push({ cls: "", html: whole ? n.whole(listJoin(shown)) : n.built(listJoin(shown)) });
      }
      if (layer === "fsa" && d.rid) {
        if (d.rid.length === 1) out.push({ cls: "", html: n.inRiding(`<b>${esc(rName(d.rid[0][0]))}</b>`) });
        else out.push({ cls: "", html: n.split(listJoin(d.rid.map(([ed, s]) => `<b>${esc(rName(ed))}</b> (${pctPlain(s)})`))) });
      }
      if (d.small) out.push({ cls: "warn", html: n.small(fmt(d.g.a.t22, "count")) });
      if (d.withheld) out.push({ cls: "", html: n.withheld });
      return out;
    }

    // ----------------------------------------------------------------------------------------
    // Popup
    // ----------------------------------------------------------------------------------------
    let popup = null;
    // One period's figures for a group: share (or change in points) and number (or change in number).
    function periodFigures(d, g, year) {
      const x = d.g[g];
      if (year === "chg") return { rate: x.chgRate == null ? null : fmt(x.chgRate, "pts"), count: x.chgRate == null ? null : fmtN(x.chgCount, d.est, "dcount") };
      const r = year === "2020" ? x.r20 : x.r22, n = year === "2020" ? x.n.u20 : x.n.u22;
      return { rate: r == null ? null : fmt(r, "pct"), count: r == null ? null : fmtN(n, d.est) };
    }
    function popupHtml(entry) {
      const d = entry.d, layer = state.layer, x = t();
      let html = `<div class="pp-type">${esc(areaKind(layer))}</div><div class="pp-name">${esc(areaName(entry))}</div>`;
      if (layer === "fsa" && d.rid) {
        html += `<div class="pp-sub">${esc(d.rid.length === 1 || d.rid[0][1] >= 99 ? x.popRiding(rName(d.rid[0][0])) : x.popMostly(rName(d.rid[0][0]), pctPlain(d.rid[0][1])))}</div>`;
      }
      if (!d.hasData) return html + `<div class="pp-na">${esc(x.popNoData)}</div>`;
      const g = state.who, f = periodFigures(d, g, state.year);
      const label = state.year === "chg"
        ? (state.mode === "rate" ? x.ppChgPct(g) : x.ppChgNum(g))
        : (state.mode === "rate" ? x.ppPct(g, state.year) : x.ppNum(g, state.year));
      if (f.rate != null) {
        const big = state.mode === "rate" ? f.rate : f.count;
        const other = state.mode === "rate" ? `${f.count} ${x.unitWho[g]}` : f.rate;
        html += `<div class="pp-main"><div class="pp-big">${esc(big)}</div><div class="pp-mlbl"><b>${esc(label)}</b><br>${esc(other)}</div></div>`;
      } else {
        html += `<div class="pp-main"><div class="pp-mlbl"><b>${esc(label)}</b><br>${esc(x.popWithheld)}</div></div>`;
      }
      html += `<div class="pp-rows">`;
      for (const y of YEARS) {
        if (y === state.year) continue;
        const h = periodFigures(d, g, y);
        html += `<div class="pp-row"><span>${esc(x.ppY[y])}</span><b>${esc(h.rate == null ? "–" : `${h.rate} · ${h.count}`)}</b></div>`;
      }
      html += `</div>`;
      const foot = [];
      if (d.est) foot.push(x.popEst);
      if (d.small) foot.push(x.popSmall);
      if (foot.length) html += `<div class="pp-foot">${foot.map(esc).join(" ")}</div>`;
      return html;
    }
    function openPopup(entry, lngLat) {
      if (popup) popup.remove();
      popup = new maplibregl.Popup({ closeButton: true, maxWidth: "310px", offset: 8, focusAfterOpen: false })
        .setLngLat(lngLat).setHTML(popupHtml(entry)).addTo(map);
      popup.on("close", () => { if (popup && !popup.isOpen()) popup = null; });
    }

    // ----------------------------------------------------------------------------------------
    // Side panel with charts
    // ----------------------------------------------------------------------------------------
    // Shades for the bars: light = the reassuring part, dark = the worrying part.
    const BAR = { good: "#9fd0ec", y20: "#8fb2d6", y22: "#245eac", bad: "#102349" };
    function stacked(segments, total) {   // value: exact (bar widths, %), shown: the number displayed
      const segs = segments.filter((s) => s.value > 0);
      const pct = (s) => fmt(total > 0 ? (s.value / total) * 100 : null, "pct");
      const bar = segs.map((s) => `<span style="flex-grow:${s.value};background:${s.color}" title="${esc(`${s.label}: ${s.shown} (${pct(s)})`)}"></span>`).join("");
      const keys = segments.map((s) => `<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span><span class="n">${esc(s.shown)}</span><span class="p">${pct(s)}</span></li>`).join("");
      const aria = segments.map((s) => `${s.label} ${s.shown} (${pct(s)})`).join(", ");
      return `<div class="sbar" role="img" aria-label="${esc(aria)}">${bar}</div><ul class="keyrows">${keys}</ul>`;
    }
    function cmp(text) { return `<div class="cmp">${esc(t().ontarioCmp)} <b>${esc(text)}</b></div>`; }
    // Horizontal bars for a few shares: [{ label, rate, count, color }], all on the same scale.
    function hbars(rows, max) {
      return `<div class="hbars" role="img" aria-label="${esc(rows.map((r) => `${r.label}: ${r.rate == null ? t().groupNA : `${fmt(r.rate, "pct")}, ${r.count}`}`).join("; "))}">${rows.map((r) => r.rate == null
        ? `<div class="hbar"><span class="lab">${esc(r.label)}</span><span class="track na">${esc(t().groupNA)}</span></div>`
        : `<div class="hbar"><span class="lab">${esc(r.label)}</span><span class="track"><span class="fill" style="width:${Math.max(1, (r.rate / max) * 64)}%;background:${r.color}"></span><span class="val">${fmt(r.rate, "pct")} <span>· ${esc(r.count)}</span></span></span></div>`).join("")}</div>`;
    }

    function panelHtml(entry, layer) {
      const isOntario = !entry;
      const d = isOntario ? ONTARIO : entry.d;
      const x = t(), O = ONTARIO;
      let html = isOntario
        ? `<div class="area-eyebrow">${esc(x.allOntario)}</div><h2 class="area-name">Ontario</h2><p class="hint">${esc(x.ontarioHint)}</p>`
        : `<div class="area-eyebrow">${esc(areaKind(layer))}</div><h2 class="area-name">${esc(areaName(entry))}</h2>
           <button type="button" class="clear-btn" data-action="clear">${esc(x.showOntario)}</button>`;
      if (!isOntario) for (const n of notesFor(entry, layer)) html += `<div class="note ${n.cls}">${n.html}</div>`;
      if (!d.hasData) return html + aboutHtml();
      const a = d.g.a, est = d.est;

      // 1. Now (2022)
      html += `<section class="block"><h3>${esc(x.bNow(2022))}</h3>`;
      if (a.r22 != null) {
        html += `<div class="hero"><span class="big">${fmt(a.r22, "pct")}</span><span class="lbl">${esc(x.heroNow(fmtN(a.n.u22, est)))}</span></div>
          ${stacked([{ label: x.segWithout, value: a.u22, shown: fmtN(a.n.u22, est), color: BAR.bad }, { label: x.segWith, value: a.t22 - a.u22, shown: fmtN(a.n.w22, est), color: BAR.good }], a.t22)}
          ${isOntario ? "" : cmp(fmt(O.g.a.r22, "pct"))}`;
      } else html += `<div class="na-msg">${esc(x.groupNA)}</div>`;
      html += `</section>`;

      // 2. Change since 2020
      html += `<section class="block"><h3>${esc(x.bChange)}</h3>`;
      if (a.chgRate != null) {
        const n = fmtN(Math.abs(a.chgCount), est), r20 = fmt(a.r20, "pct");
        const lbl = a.chgCount > 0 ? x.heroUp(r20, n) : a.chgCount < 0 ? x.heroDown(r20, n) : x.heroSame(r20);
        const max = Math.max(a.r20, a.r22, 1);
        html += `<div class="hero"><span class="mid">${fmt(a.chgRate, "pts")}</span><span class="lbl">${esc(lbl)}</span></div>
          ${hbars([{ label: "2020", rate: a.r20, count: fmtN(a.n.u20, est), color: BAR.y20 }, { label: "2022", rate: a.r22, count: fmtN(a.n.u22, est), color: BAR.y22 }], max)}
          ${isOntario ? "" : cmp(fmt(O.g.a.chgRate, "pts"))}`;
      } else html += `<div class="na-msg">${esc(x.naChange)}</div>`;
      html += `</section>`;

      // 3. Children and adults
      html += `<section class="block"><h3>${esc(x.bGroups)}</h3>`;
      const max = Math.max(1, ...["k", "d"].flatMap((g) => [d.g[g].r20 ?? 0, d.g[g].r22 ?? 0]));
      for (const g of ["k", "d"]) {
        const y = d.g[g];
        html += `<div class="grp"><div class="grp-name">${esc(x.whoName[g])}</div>
          ${hbars([{ label: "2020", rate: y.r20, count: fmtN(y.n.u20, est), color: BAR.y20 }, { label: "2022", rate: y.r22, count: fmtN(y.n.u22, est), color: BAR.y22 }], max)}
          ${isOntario || y.r22 == null ? "" : cmp(`${fmt(O.g[g].r22, "pct")} (2022)`)}</div>`;
      }
      html += `</section>`;

      html += tableHtml(d) + aboutHtml();
      return html;
    }

    function tableHtml(d) {
      const x = t();
      const cell = (n, r) => (n == null ? "–" : `${fmt(n, "count")}${r == null ? "" : `<span class="tp">${fmt(r, "pct")}</span>`}`);
      const row = (label, a, b) => `<tr><td>${esc(label)}</td><td class="num">${a}</td><td class="num">${b}</td></tr>`;
      let body = "";
      for (const g of GROUPS) {
        const y = d.g[g];
        body += `<tr><th>${esc(x.whoName[g])}</th><th class="num">2020</th><th class="num">2022</th></tr>`;
        body += row(x.rows.without, cell(y.n.u20, y.r20), cell(y.n.u22, y.r22));
        body += row(x.rows.with, cell(y.n.w20, y.r20 == null ? null : 100 - y.r20), cell(y.n.w22, y.r22 == null ? null : 100 - y.r22));
        body += row(x.rows.total[g], cell(y.n.t20, null), cell(y.n.t22, null));
      }
      return `<details class="more"><summary>${esc(x.allFigures)}</summary><table class="all"><tbody>${body}</tbody></table></details>`;
    }
    function aboutHtml() { return `<div class="about">${t().about.map((p) => `<p>${p}</p>`).join("")}</div>`; }

    function renderPanel() {
      const sel = state.selected;
      const entry = sel ? byId[sel.layer].get(sel.id) : null;
      $("panelBody").innerHTML = panelHtml(entry, sel?.layer);
    }
    $("panelBody").addEventListener("click", (e) => {
      if (e.target.closest('[data-action="clear"]')) select(null);
    });

    // ----------------------------------------------------------------------------------------
    // Selecting areas (click or search)
    // ----------------------------------------------------------------------------------------
    function select(id, lngLat) {
      const prev = state.selected;
      if (prev && map.getSource(prev.layer)) map.setFeatureState({ source: prev.layer, id: prev.id }, { selected: false });
      if (id == null) {
        state.selected = null;
        if (popup) { popup.remove(); popup = null; }
        renderPanel();
        return;
      }
      state.selected = { layer: state.layer, id };
      map.setFeatureState({ source: state.layer, id }, { selected: true });
      const entry = byId[state.layer].get(id);
      openPopup(entry, lngLat || entry.lp);
      renderPanel();
    }
    function bboxOf(geom) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const walk = (c) => { if (typeof c[0] === "number") { minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]); minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]); } else c.forEach(walk); };
      walk(geom.coordinates);
      return [[minX, minY], [maxX, maxY]];
    }
    function selectAndShow(id) {
      const entry = byId[state.layer].get(id);
      select(id, entry.lp);
      const cam = map.cameraForBounds(bboxOf(entry.feat.geometry), { padding: { ...ontarioPadding(), top: 90, bottom: 40 } });
      if (cam) map.easeTo({ center: cam.center, zoom: Math.min(cam.zoom, state.layer === "ped" ? 10.5 : 11.5), duration: 900 });
    }
    map.on("click", (e) => {
      if (!map.getLayer(`${state.layer}-fill`)) return;
      const hit = map.queryRenderedFeatures(e.point, { layers: [`${state.layer}-fill`] })[0];
      select(hit ? hit.id : null, e.lngLat);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && popup) popup.remove(); });

    // ----------------------------------------------------------------------------------------
    // Search: ridings by name; postal areas by postal code (full or first three characters) or riding name
    // ----------------------------------------------------------------------------------------
    const input = $("searchInput"), box = $("suggestions");
    // The page around an embedded map can ask for the search box (e.g. a "Search your riding" link).
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || !e.data || e.data.type !== "map:focus-search") return;
      try { input.focus({ preventScroll: true }); } catch { input.focus(); }
    });
    let matches = [], active = -1;
    const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[—–-]/g, " ").toLowerCase();
    function searchEntries() {
      return [...byId[state.layer].entries()].map(([id, e]) => {
        if (state.layer === "ped") return { id, label: areaName(e), alt: e.feat.properties.name, code: "" };
        const rid = (e.d.rid || []).map(([ed]) => rName(ed));
        const ridAlt = (e.d.rid || []).map(([ed]) => `${ridingName[ed]?.en || ""} ${ridingName[ed]?.fr || ""}`).join(" ");
        return { id, label: e.key, code: e.key, alt: ridAlt, tag: rid.slice(0, 2).join(", ") + (rid.length > 2 ? "…" : ""), hasData: e.d.hasData };
      });
    }
    function showMatches() {
      const raw = input.value.trim();
      if (!raw || !SRC[state.layer]) { closeBox(); return; }
      const all = searchEntries();
      if (state.layer === "fsa") {
        const pc = raw.replace(/\s+/g, "").toUpperCase();
        const prefix = /^[A-Z](\d([A-Z]\w*)?)?$/.test(pc) ? pc.slice(0, 3) : null;   // "M", "M9", "M9V", "M9V1A1"
        const q = fold(raw);
        matches = all.filter((e) => (prefix && e.code.startsWith(prefix)) || (q.length >= 3 && fold(e.alt).includes(q)))
          .sort((a, b) => (prefix && b.code.startsWith(prefix)) - (prefix && a.code.startsWith(prefix)) || a.code.localeCompare(b.code))
          .slice(0, 12);
      } else {
        const q = fold(raw);
        matches = all.filter((e) => fold(e.label).includes(q) || fold(e.alt).includes(q))
          .sort((a, b) => (fold(a.label).startsWith(q) ? 0 : 1) - (fold(b.label).startsWith(q) ? 0 : 1) || a.label.localeCompare(b.label, t().locale))
          .slice(0, 12);
      }
      active = matches.length ? 0 : -1;
      box.innerHTML = matches.length
        ? matches.map((m, i) => `<div role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === active}">${esc(m.label)}${m.tag ? `<span class="opt-tag"> · ${esc(m.tag)}</span>` : ""}</div>`).join("")
        : `<div class="empty">${esc(t().noMatch)}</div>`;
      box.style.display = "block";
      input.setAttribute("aria-expanded", "true");
      input.setAttribute("aria-activedescendant", active >= 0 ? `opt-${active}` : "");
    }
    function closeBox() { box.style.display = "none"; input.setAttribute("aria-expanded", "false"); }
    function choose(i) {
      const m = matches[i];
      if (!m) return;
      input.value = m.label;
      closeBox();
      selectAndShow(m.id);
    }
    input.addEventListener("input", showMatches);
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!matches.length) return;
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
        box.querySelectorAll('[role="option"]').forEach((o, i) => o.setAttribute("aria-selected", i === active));
        input.setAttribute("aria-activedescendant", `opt-${active}`);
        box.querySelector(`#opt-${active}`)?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (active >= 0) choose(active);
      } else if (e.key === "Escape") closeBox();
    });
    box.addEventListener("mousedown", (e) => { const o = e.target.closest('[role="option"]'); if (o) { e.preventDefault(); choose(+o.dataset.i); } });
    document.addEventListener("click", (e) => { if (!box.contains(e.target) && e.target !== input) closeBox(); });

    // ----------------------------------------------------------------------------------------
    // Riding / postal area switch
    // ----------------------------------------------------------------------------------------
    $("geoToggle").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b || b.dataset.layer === state.layer) return;
      select(null);
      setHover(null);
      state.layer = b.dataset.layer;
      input.value = "";
      closeBox();
      refresh();
      if (!SRC[state.layer]) showLoading(true);
    });
    function showLoading(on, text) {
      const el = $("loading");
      el.textContent = text || t().loading;
      el.style.display = on ? "block" : "none";
    }

    // ----------------------------------------------------------------------------------------
    // Language and refresh
    // ----------------------------------------------------------------------------------------
    function applyStaticText() {
      const x = t();
      $("txtTitle").textContent = x.title;
      $("txtSub").textContent = x.sub;
      $("btnByRiding").textContent = x.byRiding;
      $("btnByFsa").textContent = x.byFsa;
      $("geoToggle").setAttribute("aria-label", x.areasLabel);
      $("txtShowOnMap").textContent = x.showOnMap;
      $("txtYear").textContent = x.yearLabel;
      $("txtWho").textContent = x.whoLabel;
      $("txtShadeBy").textContent = x.shadeBy;
      input.placeholder = state.layer === "ped" ? x.searchPed : x.searchFsa;
      input.setAttribute("aria-label", input.placeholder);
      document.querySelectorAll("#geoToggle button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.layer === state.layer));
    }
    function refresh() {
      applyStaticText();
      renderControls();
      updateMapStyle();
      renderLegend();
      renderPanel();
      $("layerCard").classList.add("ready");   // options, shading switch and legend are all in place
      if (popup && state.selected) popup.setHTML(popupHtml(byId[state.selected.layer].get(state.selected.id)));
    }
    const overlay = {
      setLanguage(next) {
        L = next;
        if (input.value) input.value = "";
        closeBox();
        refresh();
      },
    };

    // ----------------------------------------------------------------------------------------
    // Start
    // ----------------------------------------------------------------------------------------
    refresh();
    // Ctrl + scroll (and trackpad pinch, which browsers send as Ctrl + scroll) zooms the map while the pointer
    // is over the map itself, and over an area's popup (passed on to the map, as if the popup weren't there).
    // Anywhere else (header, side panel, options card, map buttons, attribution) the browser would zoom the
    // whole page instead, which is easy to do by accident, so it's switched off there. Where the plain wheel
    // zooms the map (see needCooperative), it does so over a popup too.
    document.addEventListener("wheel", (e) => {
      if (map.getCanvasContainer().contains(e.target)) return;   // the map handles it
      const overPopup = e.target.closest?.(".maplibregl-popup");
      if (!e.ctrlKey && !(overPopup && !map.cooperativeGestures.isEnabled())) return;   // ordinary scrolling
      e.preventDefault();
      if (overPopup) {
        map.getCanvas().dispatchEvent(new WheelEvent("wheel", {
          deltaX: e.deltaX, deltaY: e.deltaY, deltaZ: e.deltaZ, deltaMode: e.deltaMode,
          clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY,
          ctrlKey: e.ctrlKey, metaKey: e.metaKey, shiftKey: e.shiftKey, altKey: e.altKey, bubbles: true, cancelable: true,
        }));
      }
    }, { passive: false });

    // Two-finger gestures on phones and tablets. Pinching the page by accident (over the options card, the
    // header or the details) zooms the whole page, which is confusing next to a map that zooms on its own, so
    // it's switched off everywhere but the map: by touch-action in the CSS, and here too for browsers that don't
    // fully follow it. The browser's own zoom setting still zooms the page. Over an area's popup, two fingers
    // move and zoom the map, as if the popup weren't there. (MapLibre only listens for touches that start on
    // the map itself, so this is done here.)
    const canvasBox = map.getCanvasContainer(), mapEl = map.getContainer();
    const onPopup = (el) => !!el?.closest?.(".maplibregl-popup");
    let pinch = null;   // the two-finger gesture under way over a popup
    function fingers(e) {
      const r = canvasBox.getBoundingClientRect(), [a, b] = e.touches;
      return {
        mid: [(a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top],
        dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
      };
    }
    function syncPinch(e) {   // on every finger down or up: start, restart or end the gesture
      const ts = [...e.touches];
      const ours = ts.length === 2 && ts.some((t) => onPopup(t.target)) && ts.every((t) => mapEl.contains(t.target));
      if (!ours) {
        if (pinch?.panWasOn) map.dragPan.enable();
        pinch = null;
        return;
      }
      if (!pinch) {
        map.stop();
        // A finger on the map beside the popup would otherwise move the map too. Switching the map's own
        // dragging off and on again also stops it jumping when the popup finger lifts.
        const panWasOn = map.dragPan.isEnabled();
        if (panWasOn) map.dragPan.disable();
        pinch = { panWasOn };
      }
      const f = fingers(e);
      Object.assign(pinch, { dist: f.dist, zoom: map.getZoom(), at: map.unproject(f.mid) });
    }
    function movePinch(e) {
      const f = fingers(e);
      if (f.dist > 0 && pinch.dist > 0) map.jumpTo({ zoom: pinch.zoom + Math.log2(f.dist / pinch.dist) });
      for (let i = 0; i < 2; i++) {   // then put the place first under the fingers back under them
        const p = map.project(pinch.at), c = map.project(map.getCenter());
        const dx = p.x - f.mid[0], dy = p.y - f.mid[1];
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) break;
        map.jumpTo({ center: map.unproject([c.x + dx, c.y + dy]) });
      }
    }
    for (const type of ["touchstart", "touchend", "touchcancel"]) document.addEventListener(type, syncPinch, { capture: true, passive: true });
    document.addEventListener("touchmove", (e) => {
      if (e.touches.length < 2) return;   // one finger scrolls the page (or moves the map, where it does that)
      if (pinch) { e.preventDefault(); movePinch(e); }
      else if (!canvasBox.contains(e.target)) e.preventDefault();   // over the map, the map handles it
    }, { capture: true, passive: false });
    // Safari's own pinch gesture events
    for (const type of ["gesturestart", "gesturechange"]) {
      document.addEventListener(type, (e) => { if (!canvasBox.contains(e.target)) e.preventDefault(); }, { passive: false });
    }

    // Keep the map's drawing surface the same size as its box. If the box changes size around the time the
    // map is created (e.g. the header wraps onto another line), MapLibre can miss it; the map is then drawn
    // stretched and the mouse lands on the wrong area. So resize when (and only when) the two differ: an
    // unneeded resize before the map's first frame paints the basemap's near-white space glow behind an
    // empty map, which shows as a white flash while the page loads.
    const mapBox = document.getElementById("map");
    function fitCanvasToBox() {
      const c = map.getCanvas();
      // Redraw at once (as MapLibre does itself): resizing clears the canvas, and an empty frame flashes.
      if (Math.abs(c.clientWidth - mapBox.clientWidth) > 0.5 || Math.abs(c.clientHeight - mapBox.clientHeight) > 0.5) map.resize().redraw();
    }
    new ResizeObserver(fitCanvasToBox).observe(mapBox);
    map.once("load", fitCanvasToBox);
    // A browser window can be narrowed to phone width (or widened back), so keep the scroll behaviour in step.
    window.matchMedia("(max-width: 860px)").addEventListener("change", () => {
      if (needCooperative()) map.cooperativeGestures.enable(); else map.cooperativeGestures.disable();
    });

    // Opening view: Ontario centred in the open part of the map (between the options card and the right edge),
    // with equal gaps above and below, and equal gaps left and right. Fitting a lat/long box doesn't do this on
    // the globe (its corners aren't where Ontario's edges appear), so measure where Ontario's outline actually
    // lands on screen and adjust until it sits in the middle.
    function centreOntario() {
      const box = mapBox.getBoundingClientRect(), card = document.getElementById("layerCard").getBoundingClientRect();
      const gap = narrowScreen() ? 12 : 24;
      const left = narrowScreen() ? 0 : Math.max(0, card.right - box.left);
      const area = { x0: left + gap, x1: box.width - gap, y0: gap, y1: box.height - gap };
      for (let i = 0; i < 8; i++) {
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        for (const p of DATA.outline) { const q = map.project(p); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
        const scale = Math.min((area.x1 - area.x0) / (x1 - x0), (area.y1 - area.y0) / (y1 - y0));
        const dx = (x0 + x1) / 2 - (area.x0 + area.x1) / 2, dy = (y0 + y1) / 2 - (area.y0 + area.y1) / 2;
        if (Math.abs(Math.log2(scale)) < 0.001 && Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) break;
        const c = map.project(map.getCenter());
        map.jumpTo({ center: map.unproject([c.x + dx, c.y + dy]), zoom: map.getZoom() + Math.log2(scale) });
      }
    }
    if (!startedWithView) {
      if (map.style?._loaded) centreOntario();
      else map.once("style.load", centreOntario);   // after the basemap has switched on the globe
    }
    const mapLoaded = new Promise((resolve) => (map.loaded() ? resolve() : map.once("load", resolve)));
    async function loadLayer(layer, request) {
      try {
        const [geojson] = await Promise.all([request, mapLoaded]);
        SRC[layer] = prepare(geojson, layer);
        if (!map.hasImage("att-hatch")) map.addImage("att-hatch", hatchImage(), { pixelRatio: 2 });
        addLayersFor(layer);
        if (state.layer === layer) showLoading(false);
        refresh();
      } catch (err) {
        console.error(err);
        if (state.layer === layer) showLoading(true, t().loadError);
      }
    }
    showLoading(true);
    loadLayer("ped", ridingsRequest).then(() => loadLayer("fsa", fsasRequest));
  </script>
</body>
</html>
